<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="2.1">
<title>Cinelabo</title>
<link rel="icon" type="image/png" href="IMG_2555.png">
<link rel="apple-touch-icon" href="IMG_2555.png">
<meta name="application-name" content="Cinelabo">
<meta name="apple-mobile-web-app-title" content="Cinelabo">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: #000000; }
  html, body { margin: 0; padding: 0; touch-action: manipulation; }
  body {
    --fs: 16px;
    --uifont: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    /* David Lynch palette: velvet night / curtain crimson / antique gold */
    --bg:#0F1328; --bg2:#171D38; --card:#1A2138; --card2:#232C4A;
    --text:#EDE6D6; --muted:#9AA3B8; --accent:#A31621; --line:rgba(237,230,214,.30);
    --line2:rgba(237,230,214,.14); --dash:rgba(194,155,64,.45);
    --danger:#C1272D; --nav:#0A0D18; --gold:#C29B40;
    --inkfill:#05070F; --bar:#3A4568;
    background: var(--bg); color: var(--text);
    font-family: var(--uifont);
    font-size: var(--fs); line-height: 1.6;
    padding-bottom: 126px;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  button:active { filter: brightness(1.25); }
  input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--gold); }

  /* ---------- app header ---------- */
  #appbar {
    position: sticky; top: 0; z-index: 30;
    background: var(--bg);
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 0;
    border-bottom: 1px solid var(--line2);
  }
  .abrow { display: flex; align-items: center; gap: 8px; max-width: 720px; margin: 0 auto; }
  #apptitle { font-size: calc(var(--fs) * 1.18); font-weight: 800; letter-spacing: .14em; white-space: nowrap; }
  #apptitle .ayr { color: var(--accent); margin-left: 2px; }
  #apptitle .ajp { font-size: calc(var(--fs) * .78); letter-spacing: .1em; color: var(--muted); margin-left: 6px; font-weight: 700; }
  #syncdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e5484d; flex: none; }
  .abbtns { margin-left: auto; display: flex; gap: 8px; flex: none; }
  .hbtn {
    width: 44px; height: 44px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 4px; color: var(--text);
  }
  .hbtn svg { width: 21px; height: 21px; }
  .hbtn.on { background: var(--accent); border-color: var(--accent); color: var(--text); }
  #syncbar { display: block; width: 100%; max-width: 720px; margin: 0 auto; background: none; border: none; text-align: center; font-size: calc(var(--fs) * .78); color: var(--muted); padding: 3px 16px 7px; min-height: 1.2em; letter-spacing: .03em; font-family: inherit; cursor: pointer; }
  #syncbar .err { color: var(--danger); }
  .sbhint { color: var(--gold); font-weight: 700; }

  main { max-width: 720px; margin: 0 auto; padding: 0 14px; }
  .view { display: none; min-height: calc(100dvh + 2px); }
  .view.active { display: block; }
  .view.active.slide-fwd { animation: slideFwd .30s cubic-bezier(.25,.9,.3,1); }
  .view.active.slide-back { animation: slideBack .30s cubic-bezier(.25,.9,.3,1); }
  .view.active.fadein { animation: viewin .18s ease-out; }
  @keyframes slideFwd { from { transform: translateX(56px); opacity: 0; } }
  @keyframes slideBack { from { transform: translateX(-56px); opacity: 0; } }
  @keyframes viewin { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .view.active.slide-fwd, .view.active.slide-back, .view.active.fadein { animation: none; }
    #splash { transition: none; }
  }

  /* ---------- splash (pure-black fade veil) ---------- */
  #splash { position: fixed; inset: 0; z-index: 200; background: #000; transition: opacity .45s ease; }
  #splash.hide { opacity: 0; pointer-events: none; }

  /* ---------- chevron strip (Black Lodge floor, slim band above the bar) ---------- */
  #chev {
    position: fixed; left: 0; right: 0; z-index: 59;
    bottom: calc(58px + env(safe-area-inset-bottom, 0px));
    height: 8px; pointer-events: none; opacity: .92;
    background-color: #EDE6D6;
    background-image:
      linear-gradient(135deg, #05070F 25%, transparent 25%),
      linear-gradient(225deg, #05070F 25%, transparent 25%),
      linear-gradient(45deg, #05070F 25%, transparent 25%),
      linear-gradient(315deg, #05070F 25%, #EDE6D6 25%);
    background-position: 4px 0, 4px 0, -4px 0, -4px 0;
    background-size: 8px 8px;
    background-repeat: repeat-x;
  }

  /* ---------- bottom tab bar (full-width velvet bar) ---------- */
  #tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    display: flex;
    background: var(--nav);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-shadow: 0 -1px 0 rgba(237,230,214,.12);
  }
  #tabbar button {
    flex: 1; min-height: 58px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 7px 0 6px;
    font-size: 10px; font-weight: 500; color: #7C869C; line-height: 1.25; white-space: nowrap;
  }
  #tabbar button svg { width: 22px; height: 22px; }
  #tabbar button.on { color: var(--text); font-weight: 700; }
  #tabbar button.on svg { color: var(--gold); }

  /* ---------- floating + button ---------- */
  #fab {
    position: fixed; right: 16px; z-index: 65;
    bottom: calc(82px + env(safe-area-inset-bottom, 0px));
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.55);
    border: 2px solid rgba(237,230,214,.35);
  }
  #fab svg { width: 26px; height: 26px; }
  #fab:active { transform: scale(.94); }

  /* ---------- generic ---------- */
  .caps { letter-spacing: .22em; font-weight: 800; }
  .secttl { font-size: calc(var(--fs) * 1.0); font-weight: 800; letter-spacing: .18em; margin: 20px 2px 10px; }
  .secttl:first-child { margin-top: 4px; }
  .secttl .jp { letter-spacing: .08em; font-size: calc(var(--fs) * .8); color: var(--muted); margin-left: 8px; font-weight: 700; }
  .note { font-size: calc(var(--fs) * .82); color: var(--muted); margin: 6px 2px; }
  .card { background: var(--card); border: 1.5px solid var(--line); border-radius: 6px; padding: 12px; margin-bottom: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 11px 18px; border-radius: 4px;
    background: var(--card2); color: var(--text); font-size: calc(var(--fs) * .9);
    border: 1.5px solid var(--line); font-weight: 600;
  }
  .btn.primary { background: var(--accent); color: var(--text); border-color: rgba(237,230,214,.4); font-weight: 700; }
  .btn.danger { color: var(--danger); border-color: var(--danger); }
  .btn.small { min-height: 44px; padding: 8px 14px; font-size: calc(var(--fs) * .85); }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .textin, .selin {
    width: 100%; background: #121830; border: 1.5px solid var(--line); border-radius: 4px;
    padding: 11px 12px; font-size: 16px; color: var(--text);
  }
  .selin { width: auto; }
  select.textin, select.selin { appearance: auto; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    min-height: 48px; padding: 7px 14px; border-radius: 4px;
    background: var(--card); border: 1.5px solid var(--line); color: var(--muted);
    font-size: calc(var(--fs) * .82); font-weight: 600;
  }
  .chip.on { background: var(--accent); color: var(--text); border-color: rgba(237,230,214,.4); font-weight: 700; }
  .reasonchip {
    display: inline-block; padding: 3px 9px; border-radius: 3px; margin: 0 5px 5px 0;
    background: var(--bg2); border: 1px solid var(--line); font-size: calc(var(--fs) * .76); color: var(--text);
  }
  .empty { text-align: center; color: var(--muted); padding: 24px 12px; font-size: calc(var(--fs) * .9); border: 1.5px dashed var(--dash); border-radius: 6px; }

  /* ---------- poster (fixed 2:3 box, never stretches) ---------- */
  .poster {
    position: relative; flex: none; align-self: flex-start;
    aspect-ratio: 2 / 3; border-radius: 3px; overflow: hidden;
    background: var(--card2); border: 1px solid var(--line);
    cursor: pointer; padding: 0; display: block;
  }
  .poster .pfb {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 6px; text-align: center; font-size: 11px; line-height: 1.45; color: var(--muted);
    word-break: break-all;
  }
  .poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------- home hero ---------- */
  .hero {
    position: relative; overflow: hidden;
    border: 1.5px solid var(--line); border-radius: 6px; background: var(--card);
    padding: 16px 16px 14px; margin: 14px 0 6px;
  }
  .hero .mc1 {
    position: absolute; width: 190px; height: 190px; border-radius: 50%;
    background: var(--gold); right: -64px; top: -84px; opacity: .8; pointer-events: none;
  }
  .hero .mc2 {
    position: absolute; width: 44px; height: 44px; border-radius: 50%;
    background: var(--accent); right: 118px; top: -16px; opacity: .9; pointer-events: none;
  }
  .hero .hkick { position: relative; font-size: calc(var(--fs) * .8); color: var(--muted); }
  .bignums { position: relative; display: flex; margin-top: 6px; }
  .bignum { flex: 1; }
  .bignum + .bignum { border-left: 1.5px dashed var(--dash); padding-left: 16px; }
  .bignum .bn { font-size: 46px; font-weight: 800; line-height: 1.05; letter-spacing: .01em; }
  .bignum .bn .unit { font-size: 20px; color: var(--accent); font-weight: 800; margin-left: 3px; }
  .bignum .bl { font-size: calc(var(--fs) * .78); color: var(--muted); letter-spacing: .12em; font-weight: 700; margin-top: 2px; }

  /* ---------- RECENT rows ---------- */
  .recent { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1.5px dashed var(--dash); }
  .recent:last-child { border-bottom: none; }
  .recent .rmain { flex: 1; min-width: 0; }
  .recent .rside { flex: none; text-align: right; }
  .recent .rdate { font-size: calc(var(--fs) * .8); color: var(--muted); font-weight: 700; letter-spacing: .05em; }
  .recent .provtop { font-size: calc(var(--fs) * .8); font-weight: 700; color: var(--gold); margin-top: 1px; }
  .recent .provtop:empty { display: none; }
  .stars .st { color: var(--gold); font-size: calc(var(--fs) * .86); letter-spacing: 1px; }
  .stars .stnum { font-weight: 800; font-size: calc(var(--fs) * .86); margin-left: 3px; }
  .stars .norating { color: var(--muted); font-size: calc(var(--fs) * .78); }

  /* ---------- recommendation ---------- */
  .recrow { display: flex; gap: 12px; }
  .recmain { flex: 1; min-width: 0; }
  .ftitle { font-size: calc(var(--fs) * 1.02); font-weight: 700; line-height: 1.4; }
  .forig { font-size: calc(var(--fs) * .8); color: var(--muted); margin-top: 1px; }
  .fmeta { font-size: calc(var(--fs) * .82); color: var(--muted); margin-top: 2px; }
  .provline { font-size: calc(var(--fs) * .8); color: #B9C0D0; font-weight: 600; margin-top: 3px; }
  .provline:empty { display: none; }
  .hook { font-size: calc(var(--fs) * .9); margin-top: 6px; }
  .scorebox { text-align: center; flex: none; }
  .scorebox .num { font-size: 27px; font-weight: 800; color: var(--accent); line-height: 1.1; }
  .scorebox .lbl { font-size: 10.5px; color: var(--muted); letter-spacing: .08em; font-weight: 700; }
  .topbadge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--text); background: var(--accent); border: 1.5px solid rgba(194,155,64,.65); border-radius: 3px; padding: 2px 9px; margin-bottom: 8px; }
  .ranknum { font-size: calc(var(--fs) * .85); color: var(--gold); font-weight: 800; margin-bottom: 3px; letter-spacing: .08em; }

  .axisbars { margin-top: 8px; }
  .axisrow { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: calc(var(--fs) * .76); }
  .axisrow .al { width: 80px; flex: none; color: var(--muted); }
  .axisrow .bar { position: relative; flex: 1; height: 6px; background: var(--bg2); border: 1px solid var(--line2); }
  .axisrow .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
  .axisrow .tgt { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--gold); }
  .axisrow .av { width: 52px; flex: none; text-align: right; color: var(--text); }

  /* ---------- criteria ---------- */
  .critrow { padding: 10px 0; border-bottom: 1.5px dashed var(--dash); }
  .critrow:last-child { border-bottom: none; }
  .crithead { display: flex; align-items: baseline; gap: 8px; }
  .crithead .cl { font-weight: 700; }
  .crithead .cv { margin-left: auto; font-weight: 800; color: var(--gold); }
  .crithint { font-size: calc(var(--fs) * .8); color: var(--muted); margin-top: 2px; }
  input[type="range"] { width: 100%; min-height: 44px; accent-color: var(--accent); }

  /* ---------- input / library rows ---------- */
  .librow { display: flex; gap: 10px; }
  .libmain { flex: 1; min-width: 0; }
  .fieldrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .fieldrow label { font-size: calc(var(--fs) * .78); color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .fieldrow input[type="date"], .fieldrow input[type="text"].memo {
    background: #121830; border: 1.5px solid var(--line); border-radius: 4px;
    padding: 9px 10px; font-size: 16px; color: var(--text); color-scheme: dark;
  }
  .fieldrow input[type="text"].memo { flex: 1; min-width: 140px; }
  .statusbadge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 3px; background: var(--bg2); border: 1.5px solid var(--line); color: var(--text); font-weight: 700; margin-left: 6px; vertical-align: 2px; }
  .searchrow { display: flex; gap: 8px; }
  .searchrow .textin { flex: 1; }
  .searchrow .btn { flex: none; }
  .tmdbrow { display: flex; gap: 10px; align-items: flex-start; }
  .formgrid label { display: block; font-size: calc(var(--fs) * .8); color: var(--muted); margin: 8px 0 4px; }
  .formgrid .textin { margin-top: 0; }

  /* ---------- segment control ---------- */
  .segrow { display: flex; border: 1.5px solid var(--line); border-radius: 4px; overflow: hidden; margin: 12px 0 14px; background: var(--card); }
  .segrow .seg { flex: 1; min-height: 46px; font-size: calc(var(--fs) * .86); font-weight: 600; color: var(--muted); border-right: 1.5px solid var(--line); }
  .segrow .seg:last-child { border-right: none; }
  .segrow .seg.on { background: var(--accent); color: var(--text); font-weight: 700; }

  /* ---------- stubs （半券） ---------- */
  .stubgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 12px; }
  .stubp { width: 100%; }
  .ribbon {
    position: absolute; top: 0; right: 7px; z-index: 2;
    background: var(--accent); color: var(--text);
    font-size: 10px; font-weight: 800; letter-spacing: .02em;
    padding: 3px 5px 7px; line-height: 1.15; text-align: center;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%);
  }
  .ribbon .rst { color: var(--gold); }
  .datestrip {
    position: absolute; left: 0; bottom: 7px; z-index: 2;
    background: var(--inkfill); color: var(--text);
    font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 2px 7px;
  }
  .datestrip.none { background: #3A4258; color: var(--muted); }

  /* ---------- calendar ---------- */
  .calhead { display: flex; align-items: center; gap: 8px; margin: 12px 0 10px; }
  .calhead .cm { font-size: calc(var(--fs) * 1.22); font-weight: 800; letter-spacing: .04em; }
  .calnav { width: 44px; height: 44px; flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--accent); font-size: 26px; font-weight: 800; line-height: 1; }
  .calcount { margin-left: auto; background: var(--accent); color: var(--text); font-size: calc(var(--fs) * .8); font-weight: 700; border-radius: 3px; padding: 3px 10px; letter-spacing: .06em; }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1.5px solid var(--line); border-left: 1.5px solid var(--line); background: var(--card); }
  .calwd { text-align: center; font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--muted); padding: 6px 0; border-right: 1px solid var(--line2); border-bottom: 1.5px solid var(--line); }
  .calwd.sun { color: var(--accent); }
  .calcell { position: relative; aspect-ratio: 3 / 4; border-right: 1px solid var(--line2); border-bottom: 1px solid var(--line2); overflow: hidden; }
  .calcell .cald { position: absolute; top: 3px; left: 5px; z-index: 2; font-size: 10.5px; font-weight: 700; color: var(--muted); }
  .calcell.hasfilm .cald { background: var(--bg); border: 1px solid var(--line); padding: 0 4px; color: var(--text); }
  .calcell.today { box-shadow: inset 0 0 0 2px var(--accent); }
  .calcell.today::after {
    content: ''; position: absolute; top: 0; right: 0; z-index: 3;
    border-style: solid; border-width: 0 13px 13px 0;
    border-color: transparent var(--accent) transparent transparent;
  }
  .calcell .calposter { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; display: block; background: var(--card2); border: none; cursor: pointer; }
  .calcell .calposter img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .calcell .calmore { position: absolute; right: 3px; bottom: 3px; z-index: 2; background: var(--inkfill); color: var(--text); font-size: 9.5px; font-weight: 800; padding: 1px 5px; border-radius: 2px; }

  /* ---------- statistics ---------- */
  .statyr { font-size: 36px; font-weight: 800; color: var(--accent); letter-spacing: .06em; line-height: 1.15; margin-top: 12px; }
  .statnums { display: flex; gap: 0; margin: 8px 0 4px; }
  .statnum { flex: 1; }
  .statnum + .statnum { border-left: 1.5px dashed var(--dash); padding-left: 16px; }
  .statnum .n { font-size: 40px; font-weight: 800; line-height: 1.1; }
  .statnum .n .unit { font-size: 17px; color: var(--accent); font-weight: 800; margin-left: 2px; }
  .statnum .l { font-size: calc(var(--fs) * .78); color: var(--muted); letter-spacing: .1em; font-weight: 700; }
  .vbars { display: flex; align-items: flex-end; gap: 5px; height: 108px; margin-top: 10px; }
  .vbar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .vbar .vb { width: 100%; max-width: 26px; background: var(--bar); min-height: 2px; }
  .vbar.max .vb { background: var(--accent); }
  .vbar .vl { font-size: 10px; color: var(--muted); margin-top: 4px; font-weight: 700; }
  .vbar .vc { font-size: 10px; font-weight: 800; margin-bottom: 3px; }
  .hbar { display: flex; align-items: center; gap: 9px; margin-top: 7px; font-size: calc(var(--fs) * .82); }
  .hbar .hl { width: 108px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .hbar .ht { position: relative; flex: 1; height: 13px; background: var(--bg2); border: 1px solid var(--line2); }
  .hbar .hf { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); }
  .hbar.max .hf { background: var(--accent); }
  .hbar .hv { width: 40px; flex: none; text-align: right; font-weight: 800; }
  .top3 { display: flex; align-items: flex-end; justify-content: center; gap: 12px; margin-top: 12px; }
  .top3 .t3 { text-align: center; }
  .top3 .t3rank { font-size: 20px; font-weight: 800; color: var(--gold); margin-top: 6px; line-height: 1.1; }
  .top3 .t3stars { font-size: calc(var(--fs) * .8); font-weight: 700; }
  .top3 .t3stars .st { color: var(--gold); }

  /* ---------- settings (diary composition, Lynch skin) ---------- */
  .groupcard { background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; padding: 4px 18px; margin-bottom: 22px; }
  .groupcard .srow:last-child { border-bottom: none; }
  .srow {
    display: flex; align-items: center; gap: 15px; width: 100%; text-align: left;
    padding: 16px 0; border-bottom: 1.5px dashed var(--dash); min-height: 48px; color: var(--text);
  }
  .srow:last-child { border-bottom: none; }
  .srow:active { opacity: .6; }
  .srow .ic { flex: none; width: 26px; height: 26px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
  .srow .ic svg { width: 25px; height: 25px; }
  .srow .lb { flex: 1; font-size: calc(var(--fs) * 1.02); min-width: 0; }
  .srow .val { color: var(--muted); font-size: calc(var(--fs) * .95); }
  .srow .chev { color: var(--muted); font-size: 22px; line-height: 1; }
  .pillrow {
    display: flex; align-items: center; gap: 15px; width: 100%; text-align: left;

const CATALOG_BY_KEY = {};
CATALOG.forEach(f=>{ CATALOG_BY_KEY[f.key]=f; });

/* ================= data store ================= */
const LS_DATA='movieStandalone.data.v1';
const LS_TMDB='tmdb-read-token';
const DATA_VERSION=1;
/* Blank defaults only. Personal data (watched films, ratings, criteria) is
   NEVER embedded in this public file — it lives only in Drive movie.json
   (created by the app) and in this device's local storage. */
const DEFAULT_CRITERIA={ targets:{ shock:0, unease:0, beauty:0, aftertaste:0, gore:0, quiet:0, difficulty:0 }, maxGore:0, maxRuntime:0 };
function seedData(){
  return {
    version: DATA_VERSION,
    updatedAt: 0, /* 0 so real data adopted from Drive always wins on first sync */
    films: [],
    criteria: JSON.parse(JSON.stringify(DEFAULT_CRITERIA))
  };
}
function normalizeFilm(f){
  if(!f || typeof f!=='object') return null;
  return {
    id: f.id || genId(),
    catalogKey: f.catalogKey || null,
    tmdbId: (typeof f.tmdbId==='number') ? f.tmdbId : null,
    title: f.title || '',
    titleOrig: f.titleOrig || '',
    year: (typeof f.year==='number') ? f.year : null,
    director: f.director || '',
    runtime: (typeof f.runtime==='number') ? f.runtime : null,
    poster: f.poster || null,
    status: f.status==='want' ? 'want' : 'watched',
    rating: (typeof f.rating==='number') ? f.rating : null,
    memo: (typeof f.memo==='string') ? f.memo : null,
    watchedDate: f.watchedDate || null
  };
}
function normalizeData(d){
  if(!d || typeof d!=='object') return null;
  const c=(d.criteria && typeof d.criteria==='object') ? d.criteria : {};
  const t=(c.targets && typeof c.targets==='object') ? c.targets : {};
  const targets={};
  AXIS_KEYS.forEach(k=>{ targets[k]=(typeof t[k]==='number') ? t[k] : DEFAULT_CRITERIA.targets[k]; });
  return {
    version: DATA_VERSION,
    updatedAt: (typeof d.updatedAt==='number') ? d.updatedAt : 0,
    films: Array.isArray(d.films) ? d.films.map(normalizeFilm).filter(Boolean) : [],
    criteria: {
      targets: targets,
      maxGore: (typeof c.maxGore==='number') ? c.maxGore : DEFAULT_CRITERIA.maxGore,
      maxRuntime: (typeof c.maxRuntime==='number') ? c.maxRuntime : DEFAULT_CRITERIA.maxRuntime
    }
  };
}
let DB=null;
let dataRev=0;
const renderedRev={};
function loadLocal(){
  try{ const raw=storeGet(LS_DATA); if(raw){ const d=normalizeData(JSON.parse(raw)); if(d){ DB=d; return; } } }catch(e){}
  DB=seedData(); saveLocal();
}
function saveLocal(){ try{ storeSet(LS_DATA, JSON.stringify(DB)); }catch(e){} }
function touch(){ DB.updatedAt=Date.now(); dataRev++; saveLocal(); scheduleSync(); }
function filmById(id){ return DB.films.find(f=>f.id===id) || null; }
function filmByCatalogKey(key){ return DB.films.find(f=>f.catalogKey===key) || null; }
function posterFor(film){
  if(film.catalogKey && CATALOG_BY_KEY[film.catalogKey]) return CATALOG_BY_KEY[film.catalogKey].poster;
  return film.poster || null;
}
function runtimeFor(film){
  if(typeof film.runtime==='number') return film.runtime;
  if(film.catalogKey && CATALOG_BY_KEY[film.catalogKey]) return CATALOG_BY_KEY[film.catalogKey].runtime;
  return null;
}

/* ================= recommendations ================= */
function tasteProfile(){
  const rated=DB.films.filter(f=>f.status==='watched' && typeof f.rating==='number' && f.rating>=4 && f.catalogKey && CATALOG_BY_KEY[f.catalogKey]);
  if(!rated.length) return null;
  const avg={};
  AXIS_KEYS.forEach(k=>{ avg[k]=rated.reduce((s,f)=>s+CATALOG_BY_KEY[f.catalogKey].axes[k],0)/rated.length; });
  return { profile: avg, count: rated.length };
}
function computeRecommendations(){
  const tp=tasteProfile();
  const targets={};
  AXIS_KEYS.forEach(k=>{ targets[k]= tp ? (DB.criteria.targets[k]+tp.profile[k])/2 : DB.criteria.targets[k]; });
  const picks=[];
  for(const film of CATALOG){
    if(filmByCatalogKey(film.key)) continue; /* already in library (watched or want) */
    if(DB.criteria.maxRuntime>0 && film.runtime>DB.criteria.maxRuntime) continue;
    if(film.axes.gore>DB.criteria.maxGore) continue;
    const detail=AXES.map(a=>{
      const fv=film.axes[a.key], tv=targets[a.key];
      const closeness=Math.round((1-Math.abs(fv-tv)/5)*10)/10;
      return { key:a.key, label:a.label, filmValue:fv, targetValue:tv, closeness:closeness };
    });
    const score=Math.round(100*detail.reduce((s,d)=>s+d.closeness,0)/detail.length);
    const perfect=detail.filter(d=>d.closeness>=1);
    let reasons=perfect.slice(0,2);
    if(reasons.length<2){
      const rest=detail.filter(d=>d.closeness<1).sort((x,y)=>y.closeness-x.closeness);
      reasons=reasons.concat(rest.slice(0,2-reasons.length));
    }
    picks.push({ film:film, score:score, axisDetail:detail,
      reasons: reasons.map(d=>d.label+' '+fmt1(d.filmValue)+'（狙い '+fmt1(d.targetValue)+'）') });
  }
  picks.sort((a,b)=>b.score-a.score); /* stable: catalog order breaks ties, like the Space */
  return { picks:picks, blendedTargets:targets, profileCount: tp?tp.count:0, profileSource: tp?'blended':'criteria-only' };
}

/* ================= poster + lightbox ================= */
function posterHTML(posterUrl, title, width){
  const w=width||84;
  let inner='<span class="pfb">'+esc(title||'')+'</span>';
  if(posterUrl) inner+='<img src="'+escA(posterUrl)+'" alt="" loading="lazy" onerror="this.remove()">';
  return '<button type="button" class="poster" style="width:'+w+'px" data-poster="'+escA(posterUrl||'')+'" data-title="'+escA(title||'')+'" onclick="posterTap(this)" aria-label="ポスターを拡大">'+inner+'</button>';
}
function posterTap(el){
  const url=el.getAttribute('data-poster');
  const title=el.getAttribute('data-title')||'';
  if(!url) return;
  openLightbox(url, title, el.getAttribute('data-meta')||'');
  const tid=el.getAttribute('data-tmdb');
  fillLbProv(tid ? parseInt(tid,10) : null);
}
function enlargeUrl(url){ return url ? url.replace('/t/p/w342/','/t/p/w780/').replace('/t/p/w185/','/t/p/w780/') : url; }
function openLightbox(url, title, meta){
  const lb=$('lightbox'); if(!lb) return;
  const img=$('lbimg');
  const big=enlargeUrl(url);
  img.style.opacity='1';
  img.onerror=function(){ img.style.opacity='0'; };
  img.onload=function(){ img.style.opacity='1'; };
  img.src=url; /* the already-loaded small poster shows instantly (no black void) */
  if(big && big!==url){
    const pre=new Image();
    pre.onload=function(){ img.src=big; };
    /* on failure the small poster simply stays */
    pre.src=big;
  }
  $('lbtitle').textContent=title||'';
  $('lbmeta').textContent=meta||'';
  const lp=$('lbprov'); if(lp) lp.textContent='';
  lb.classList.add('open');
}
function closeLightbox(){ const lb=$('lightbox'); if(lb) lb.classList.remove('open'); }
function posterWithMeta(posterUrl, title, meta, width, tmdbId){
  const html=posterHTML(posterUrl, title, width);
  return html.replace('onclick="posterTap(this)"', 'data-meta="'+escA(meta||'')+'"'+(tmdbId?' data-tmdb="'+tmdbId+'"':'')+' onclick="posterTap(this)"');
}
function metaLine(f){
  const parts=[];
  if(f.year) parts.push(f.year+'年');
  if(f.director) parts.push(f.director);
  const rt=runtimeFor(f); if(rt) parts.push(rt+'分');
  return parts.join('／');
}

function ratingOptions(sel){
  let h='<option value="">未評価</option>';
  for(let v=0.5; v<=5.0001; v+=0.5){
    const val=Math.round(v*10)/10;
    h+='<option value="'+val+'"'+(sel===val?' selected':'')+'>★'+fmt1(val)+'</option>';
  }
  return h;
}
function axisBarsHTML(detail){
  let h='<div class="axisbars">';
  for(const d of detail){
    h+='<div class="axisrow"><span class="al">'+esc(d.label)+'</span>'+
      '<span class="bar"><span class="fill" style="width:'+(d.filmValue/5*100)+'%"></span>'+
      '<span class="tgt" style="left:calc('+(d.targetValue/5*100)+'% - 1px)"></span></span>'+
      '<span class="av">'+fmt1(d.filmValue)+' / '+fmt1(d.targetValue)+'</span></div>';
  }
  return h+'</div>';
}
function addCatalogFilm(key, status, rating){
  const c=CATALOG_BY_KEY[key]; if(!c) return;
  const ex=filmByCatalogKey(key);
  if(ex){ ex.status=status; if(typeof rating==='number') ex.rating=rating; touch(); renderAll(); return; }
  DB.films.push({ id:genId(), catalogKey:key, tmdbId:null, title:c.title, titleOrig:c.titleOrig, year:c.year, director:c.director, runtime:null, poster:null, status:status, rating:(typeof rating==='number')?rating:null, memo:null, watchedDate:null });
  touch(); renderAll();
}

/* ================= view: ホーム（おすすめ＋RECENT） ================= */
function starsHTML(r){
  if(typeof r!=='number') return '<span class="norating">未評価</span>';
  const full=Math.max(1, Math.round(r));
  return '<span class="st">'+'★'.repeat(full)+'</span><span class="stnum">'+fmt1(r)+'</span>';
}
function fmtDateShort(dstr){
  if(!dstr) return '—';
  const p=dstr.split('-');
  if(p.length!==3) return dstr;
  return parseInt(p[1],10)+'/'+parseInt(p[2],10);
}
function watchedSorted(){
  const idx={};
  DB.films.forEach((f,i)=>{ idx[f.id]=i; });
  return DB.films.filter(f=>f.status==='watched').sort((a,b)=>{
    const da=a.watchedDate||'', db=b.watchedDate||'';
    if(da!==db) return da<db ? 1 : -1; /* newest first, undated last */
    return idx[b.id]-idx[a.id]; /* later-added first within the same day */
  });
}
function recentRowHTML(f){
  const ptid=tmdbIdForFilm(f);
  let h='<div class="recent">'+posterWithMeta(posterFor(f), f.title, metaLine(f), 48, ptid)+
    '<div class="rmain"><div class="ftitle" style="font-size:15px">'+esc(f.title)+'</div>'+
    '<div class="stars">'+starsHTML(f.rating)+'</div></div>'+
    '<div class="rside"><div class="rdate">'+fmtDateShort(f.watchedDate)+'</div>';
  if(ptid && getTmdbToken()) h+='<div class="provtop" data-tmdb="'+ptid+'"></div>';
  h+='</div></div>';
  return h;
}
function recCardHTML(pick, isTop, rank){
  const f=pick.film;
  let h='<div class="card">';
  if(isTop) h+='<span class="topbadge">今夜のおすすめ</span>';
  else h+='<div class="ranknum">'+rank+'位</div>';
  h+='<div class="recrow">'+posterWithMeta(f.poster, f.title, metaLine(f), isTop?96:76, f.tmdbId);
  h+='<div class="recmain"><div style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1;min-width:0">'+
    '<div class="ftitle">'+esc(f.title)+'</div><div class="forig">'+esc(f.titleOrig||'')+'</div>'+
    '<div class="fmeta">'+esc(metaLine(f))+(f.genres&&f.genres.length?'／'+esc(f.genres.join('・')):'')+'</div></div>'+
    '<div class="scorebox"><div class="num">'+pick.score+'</div><div class="lbl">マッチ度</div></div></div>';
  h+=provLineHTML(f.tmdbId, null);
  h+='<div class="hook">'+esc(f.hook||'')+'</div>';
  h+='<div style="margin-top:8px">'+pick.reasons.map(r=>'<span class="reasonchip">'+esc(r)+'</span>').join('')+'</div>';
  h+=axisBarsHTML(pick.axisDetail);
  h+='<div class="btnrow"><button class="btn small" onclick="addCatalogFilm(\''+f.key+'\',\'want\',null)">観たいに追加</button>'+
     '<button class="btn small primary" onclick="addCatalogFilm(\''+f.key+'\',\'watched\',null)">観た</button></div>';
  h+='</div></div></div>';
  return h;
}
function renderHome(){
  const wrap=$('homewrap'); if(!wrap) return;
  if(renderedRev.home===dataRev) return;
  renderedRev.home=dataRev;
  const watched=DB.films.filter(f=>f.status==='watched');
  const want=DB.films.filter(f=>f.status==='want');
  const now=new Date(), Y=now.getFullYear(), ym=Y+'-'+pad2(now.getMonth()+1);
  const dated=watched.filter(f=>f.watchedDate);
  const thisYear=dated.filter(f=>f.watchedDate.indexOf(Y+'-')===0).length;
  const thisMonth=dated.filter(f=>f.watchedDate.indexOf(ym)===0).length;
  let n1, l1, n2, l2;
  if(dated.length){ n1=thisYear; l1='今年の鑑賞'; n2=thisMonth; l2='今月の鑑賞'; }
  else { n1=watched.length; l1='観た映画（通算）'; n2=want.length; l2='観たい映画'; }
  let h='<div class="hero"><span class="mc1"></span><span class="mc2"></span>'+
    '<div class="hkick caps">CINELABO '+Y+'</div>'+
    '<div class="bignums">'+
    '<div class="bignum"><div class="bn">'+n1+'<span class="unit">本</span></div><div class="bl">'+l1+'</div></div>'+
    '<div class="bignum"><div class="bn">'+n2+'<span class="unit">本</span></div><div class="bl">'+l2+'</div></div>'+
    '</div></div>';
  /* RECENT */
  h+='<div class="secttl caps">RECENT<span class="jp">最近観た</span></div>';
  const rec=watchedSorted().slice(0,5);
  h+= rec.length ? rec.map(recentRowHTML).join('') : '<div class="empty">まだ記録がありません</div>';
  /* おすすめ */
  h+='<div class="secttl caps">RECOMMEND<span class="jp">おすすめ</span></div>';
  const r=computeRecommendations();
  if(r.profileSource==='criteria-only'){
    h+='<div class="note">まだ好みプロフィールがありません（★4以上で評価した映画が種になります）。今は判定基準だけで選んでいます。「好み入力」で好きな映画を★4以上で登録すると、判定基準と半々で混ぜておすすめします。</div>';
  } else {
    h+='<div class="note">好みプロフィール（★4以上の'+r.profileCount+'本）と判定基準を半々で混ぜて選んでいます。</div>';
  }
  if(!r.picks.length){
    h+='<div class="empty">条件に合う未登録の映画がありません。判定基準の上限を緩めてみてください。</div>';
  } else {
    h+=recCardHTML(r.picks[0], true, 1);
    if(r.picks.length>1){
      h+='<div class="secttl caps">NEXT<span class="jp">候補</span></div>';
      r.picks.slice(1,12).forEach((p,i)=>{ h+=recCardHTML(p, false, i+2); });
    }
  }
  wrap.innerHTML=h;
  scanProviders();
}

/* ================= view: カレンダー ================= */
let calY=null, calM=null;
function renderCalendar(){
  const wrap=$('calwrap'); if(!wrap) return;
  const now=new Date();
  if(calY===null){ calY=now.getFullYear(); calM=now.getMonth(); }
  const ckey=calY+'-'+calM;
  if(renderedRev.calendar===dataRev && renderedRev.calKey===ckey) return;
  renderedRev.calendar=dataRev; renderedRev.calKey=ckey;
  const byDay={};
  let undated=0;
  DB.films.filter(f=>f.status==='watched').forEach(f=>{
    if(f.watchedDate){ (byDay[f.watchedDate]=byDay[f.watchedDate]||[]).push(f); }
    else undated++;
  });
  const startDay=new Date(calY, calM, 1).getDay();
  const days=new Date(calY, calM+1, 0).getDate();
  const monthPrefix=calY+'-'+pad2(calM+1);
  let monthCount=0;
  Object.keys(byDay).forEach(k=>{ if(k.indexOf(monthPrefix)===0) monthCount+=byDay[k].length; });
  const todayStr=now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-'+pad2(now.getDate());
  let h='<div class="calhead"><button class="calnav" onclick="calMove(-1)" aria-label="前の月">‹</button>'+
    '<div class="cm">'+calY+'年'+(calM+1)+'月</div>'+
    '<button class="calnav" onclick="calMove(1)" aria-label="次の月">›</button>'+
    '<span class="calcount">'+monthCount+' 本</span></div>';
  h+='<div class="calgrid">';
  ['日','月','火','水','木','金','土'].forEach((w,i)=>{ h+='<div class="calwd'+(i===0?' sun':'')+'">'+w+'</div>'; });
  for(let i=0;i<startDay;i++) h+='<div class="calcell"></div>';
  for(let d=1; d<=days; d++){
    const ds=calY+'-'+pad2(calM+1)+'-'+pad2(d);
    const films=byDay[ds]||[];
    const f=films[0];
    h+='<div class="calcell'+(films.length?' hasfilm':'')+(ds===todayStr?' today':'')+'">';
    if(f){
      const p=posterFor(f), ptid=tmdbIdForFilm(f);
      h+='<button type="button" class="calposter" data-poster="'+escA(p||'')+'" data-title="'+escA(f.title||'')+'" data-meta="'+escA(metaLine(f))+'"'+(ptid?' data-tmdb="'+ptid+'"':'')+' onclick="posterTap(this)" aria-label="'+escA(f.title)+'">'+(p?'<img src="'+escA(p)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</button>';
      if(films.length>1) h+='<span class="calmore">+'+(films.length-1)+'</span>';
    }
    h+='<span class="cald">'+d+'</span></div>';
  }
  h+='</div>';
  if(undated) h+='<div class="note" style="margin-top:10px">日付未設定の観た映画が'+undated+'本あります（作品タブで鑑賞日を設定するとカレンダーに出ます）。</div>';
  wrap.innerHTML=h;
}
function calMove(d){
  calM+=d;
  if(calM<0){ calM=11; calY--; }
  if(calM>11){ calM=0; calY++; }
  delete renderedRev.calendar;
  renderCalendar();
}

/* ================= view: 統計 ================= */
let statsMode='months';
function setStatsMode(m){ statsMode=m; delete renderedRev.stats; renderStats(); }
function hbarHTML(label, val, max, suffix){
  const pct=max>0 ? Math.round(val/max*100) : 0;
  return '<div class="hbar'+(max>0 && val===max && val>0 ? ' max':'')+'"><span class="hl">'+esc(label)+'</span><span class="ht"><span class="hf" style="width:'+pct+'%"></span></span><span class="hv">'+val+(suffix||'')+'</span></div>';
}
function renderStats(){
  const wrap=$('statswrap'); if(!wrap) return;
  if(renderedRev.stats===dataRev && renderedRev.statsMode===statsMode) return;
  renderedRev.stats=dataRev; renderedRev.statsMode=statsMode;
  const watched=DB.films.filter(f=>f.status==='watched');
  const Y=new Date().getFullYear();
  let h='<div class="statyr">'+Y+'</div><div class="caps" style="font-size:calc(var(--fs) * .82)">STATISTICS</div>';
  h+='<div class="segrow"><button class="seg'+(statsMode==='months'?' on':'')+'" onclick="setStatsMode(\'months\')">月ごと</button>'+
     '<button class="seg'+(statsMode==='years'?' on':'')+'" onclick="setStatsMode(\'years\')">年ごと</button></div>';
  /* headline numbers (whole library, always meaningful) */
  let rtSum=0, rtCount=0;
  watched.forEach(f=>{ const rt=runtimeFor(f); if(typeof rt==='number'){ rtSum+=rt; rtCount++; } });
  const rtH=Math.floor(rtSum/60), rtM=rtSum%60;
  h+='<div class="statnums">'+
    '<div class="statnum"><div class="n">'+watched.length+'<span class="unit">本</span></div><div class="l">記録本数</div></div>'+
    '<div class="statnum"><div class="n">'+(rtCount ? rtH+'<span class="unit">時間</span>'+(rtM? rtM+'<span class="unit">分</span>':'') : '—')+'</div><div class="l">総鑑賞時間'+(rtCount?'（'+rtCount+'本分）':'')+'</div></div>'+
    '</div>';
  /* period bars */
  const dated=watched.filter(f=>f.watchedDate);
  if(statsMode==='months'){
    h+='<div class="secttl caps">MONTHLY<span class="jp">'+Y+'年の月別本数</span></div>';
    if(dated.length){
      const counts=[];
      let mx=0;
      for(let m=0;m<12;m++){
        const c=dated.filter(f=>f.watchedDate.indexOf(Y+'-'+pad2(m+1))===0).length;
        counts.push(c); if(c>mx) mx=c;
      }
      h+='<div class="vbars">';
      counts.forEach((c,m)=>{
        h+='<div class="vbar'+(mx>0 && c===mx && c>0 ? ' max':'')+'">'+(c? '<span class="vc">'+c+'</span>' : '')+'<span class="vb" style="height:'+(mx>0 ? Math.max(4, Math.round(c/mx*64)) : 2)+'px"></span><span class="vl">'+(m+1)+'</span></div>';
      });
      h+='</div>';
    } else {
      h+='<div class="note">鑑賞日が設定された映画がまだありません（作品タブで鑑賞日を入れると集計されます）。</div>';
    }
  } else {
    h+='<div class="secttl caps">YEARLY<span class="jp">年別本数</span></div>';
    if(dated.length){
      const byYear={};
      dated.forEach(f=>{ const y=f.watchedDate.slice(0,4); byYear[y]=(byYear[y]||0)+1; });
      const ys=Object.keys(byYear).sort().reverse();
      const mx=Math.max.apply(null, ys.map(y=>byYear[y]));
      ys.forEach(y=>{ h+=hbarHTML(y+'年', byYear[y], mx, ' 本'); });
    } else {
      h+='<div class="note">鑑賞日が設定された映画がまだありません。</div>';
    }
  }
  /* star distribution */
  const rated=watched.filter(f=>typeof f.rating==='number');
  h+='<div class="secttl caps">RATINGS<span class="jp">星の分布</span></div>';
  if(rated.length){
    const buckets=[5,4.5,4,3.5,3,2.5,2,1.5,1,0.5].map(v=>({ v:v, c:rated.filter(f=>f.rating===v).length })).filter(b=>b.c>0);
    const mx=Math.max.apply(null, buckets.map(b=>b.c));
    buckets.forEach(b=>{ h+=hbarHTML('★'+fmt1(b.v), b.c, mx, ' 本'); });
  } else {
    h+='<div class="note">評価が付いた映画がまだありません。</div>';
  }
  /* providers (from the TMDb providers cache only) */
  h+='<div class="secttl caps">SERVICES<span class="jp">配信サービス別（取得済みの情報から）</span></div>';
  const cache=provLoad();
  const svc={};
  watched.forEach(f=>{
    const id=tmdbIdForFilm(f); if(!id) return;
    const e=cache['p'+id];
    if(e && e.flatrate) e.flatrate.forEach(n=>{ svc[n]=(svc[n]||0)+1; });
  });
  const svcKeys=Object.keys(svc).sort((a,b)=>svc[b]-svc[a]).slice(0,8);
  if(svcKeys.length){
    const mx=Math.max.apply(null, svcKeys.map(k=>svc[k]));
    svcKeys.forEach(k=>{ h+=hbarHTML(k, svc[k], mx, ' 本'); });
  } else {
    h+='<div class="note">まだ集計できる配信情報がありません。作品の配信表示が取得されると、ここに集計されます。</div>';
  }
  /* genres / directors */
  const genres={}, dirs={};
  watched.forEach(f=>{
    if(f.catalogKey && CATALOG_BY_KEY[f.catalogKey]) (CATALOG_BY_KEY[f.catalogKey].genres||[]).forEach(g=>{ genres[g]=(genres[g]||0)+1; });
    if(f.director) dirs[f.director]=(dirs[f.director]||0)+1;
  });
  const gk=Object.keys(genres).sort((a,b)=>genres[b]-genres[a]).slice(0,12);
  if(gk.length){
    h+='<div class="secttl caps">GENRES<span class="jp">よく観るジャンル</span></div><div class="chips">'+
      gk.map(g=>'<span class="chip" style="min-height:44px">'+esc(g)+' '+genres[g]+'</span>').join('')+'</div>';
  }
  const dk=Object.keys(dirs).sort((a,b)=>dirs[b]-dirs[a]).slice(0,12);
  if(dk.length){
    h+='<div class="secttl caps">DIRECTORS<span class="jp">よく観る監督</span></div><div class="chips">'+
      dk.map(d=>'<span class="chip" style="min-height:44px">'+esc(d)+' '+dirs[d]+'</span>').join('')+'</div>';
  }
  /* top 3 */
  const top=rated.slice().sort((a,b)=>b.rating-a.rating).slice(0,3);
  if(top.length){
    h+='<div class="secttl caps">TOP 3<span class="jp">高評価</span></div><div class="top3">';
    const order = top.length===3 ? [top[1], top[0], top[2]] : top;
    order.forEach(f=>{
      const rank=top.indexOf(f)+1;
      h+='<div class="t3">'+posterWithMeta(posterFor(f), f.title, metaLine(f), rank===1?92:72, tmdbIdForFilm(f))+
        '<div class="t3rank">'+rank+'</div><div class="t3stars"><span class="st">★</span>'+fmt1(f.rating)+'</div></div>';
    });
    h+='</div>';
  }
  /* hidden provider lines so the cache warms for the services section */
  if(getTmdbToken()){
    watched.forEach(f=>{ const id=tmdbIdForFilm(f); if(id) h+='<span class="provline" data-tmdb="'+id+'" style="display:none"></span>'; });
  }
  wrap.innerHTML=h;
  scanProviders();
}

/* ================= view: 判定基準 ================= */
function renderCriteria(){
  const wrap=$('criteriawrap'); if(!wrap) return;
  const c=DB.criteria;
  let h='<div class="note">各軸で「求める強さ」を調整します。おすすめは、この基準と好みプロフィール（★4以上の映画の平均）を半々で混ぜて計算します。</div><div class="card">';
  for(const a of AXES){
    h+='<div class="critrow"><div class="crithead"><span class="cl">'+esc(a.label)+'</span><span class="cv" id="critval-'+a.key+'">'+fmt1(c.targets[a.key])+'</span></div>'+
      '<div class="crithint">'+esc(a.hint)+'</div>'+
      '<input type="range" min="0" max="5" step="0.5" value="'+c.targets[a.key]+'" oninput="onTargetInput(\''+a.key+'\', this.value)"></div>';
  }
  h+='</div>';
  h+='<div class="secttl">上映時間の上限</div><div class="chips">';
  const rtOpts=[{v:0,l:'指定なし'},{v:90,l:'90分以内'},{v:120,l:'120分以内'},{v:150,l:'150分以内'}];
  for(const o of rtOpts) h+='<button class="chip'+(c.maxRuntime===o.v?' on':'')+'" onclick="onMaxRuntime('+o.v+')">'+o.l+'</button>';
  h+='</div>';
  h+='<div class="secttl">グロの上限</div><div class="card"><div class="critrow"><div class="crithead"><span class="cl">グロ・暴力の上限</span><span class="cv" id="critval-maxgore">'+fmt1(c.maxGore)+'</span></div>'+
    '<div class="crithint">この値を超える映画はおすすめから除外します</div>'+
    '<input type="range" min="0" max="5" step="0.5" value="'+c.maxGore+'" oninput="onMaxGoreInput(this.value)"></div></div>';
  wrap.innerHTML=h;
}
function onTargetInput(key, val){
  DB.criteria.targets[key]=parseFloat(val);
  const el=$('critval-'+key); if(el) el.textContent=fmt1(DB.criteria.targets[key]);
  touch();
}
function onMaxGoreInput(val){
  DB.criteria.maxGore=parseFloat(val);
  const el=$('critval-maxgore'); if(el) el.textContent=fmt1(DB.criteria.maxGore);
  touch();
}
function onMaxRuntime(v){ DB.criteria.maxRuntime=v; touch(); renderCriteria(); }

/* ================= TMDb ================= */
let tmdbQuery='';
function getTmdbToken(){ return (storeGet(LS_TMDB)||'').trim(); }
async function tmdbFetch(path){
  const tok=getTmdbToken();
  const res=await fetch('https://api.themoviedb.org/3'+path, { headers:{ Authorization:'Bearer '+tok, Accept:'application/json' } });
  if(res.status===401) throw new Error('TMDbのトークンが無効です（401）。設定タブでトークンを確認してください。');
  if(!res.ok) throw new Error('TMDb検索に失敗しました（HTTP '+res.status+'）');
  return res.json();
}
async function doTmdbSearch(){
  const q=($('tmdbq').value||'').trim();
  tmdbQuery=q;
  if(!q){ tmdbMsg=''; tmdbResults=[]; renderInput(); return; }
  tmdbMsg='検索中…'; renderInput();
  const inp=$('tmdbq'); if(inp) inp.value=q;
  try{
    const j=await tmdbFetch('/search/movie?language=ja-JP&include_adult=false&query='+encodeURIComponent(q));
    const seen={}; const out=[];
    for(const m of (j.results||[])){ if(m && m.id && !seen[m.id]){ seen[m.id]=1; out.push(m); } }
    tmdbResults=out;
    tmdbMsg=out.length ? out.length+'件見つかりました' : '見つかりませんでした';
  }catch(e){
    tmdbResults=[]; tmdbMsg=(e && e.message) ? e.message : String(e);
  }
  renderInput();
  const inp2=$('tmdbq'); if(inp2) inp2.value=q;
}
async function registerTmdb(i){
  const m=tmdbResults[i]; if(!m) return;
  const sel=$('tmdb-rating-'+i);
  const rating=(sel && sel.value) ? parseFloat(sel.value) : null;
  let director='', runtime=null;
  try{
    const d=await tmdbFetch('/movie/'+m.id+'?language=ja-JP&append_to_response=credits');
    if(typeof d.runtime==='number') runtime=d.runtime;
    const crew=(d.credits && d.credits.crew) || [];
    const dir=crew.find(c=>c.job==='Director');
    if(dir) director=dir.name||'';
  }catch(e){ /* details are best-effort; registration still proceeds */ }
  DB.films.push({ id:genId(), catalogKey:null, tmdbId:m.id,
    title:m.title||m.original_title||'', titleOrig:m.original_title||'',
    year:m.release_date ? parseInt(m.release_date.slice(0,4),10) : null,
    director:director, runtime:runtime,
    poster: m.poster_path ? 'https://image.tmdb.org/t/p/w342'+m.poster_path : null,
    status:'watched', rating:rating, memo:null, watchedDate:null });
  touch(); renderAll();
  alert('登録しました。ライブラリで確認できます。');
}

/* ================= watch providers (TMDb / JustWatch, region JP) =================
   Availability data comes only from TMDb's /watch/providers response
   (JustWatch-sourced). Nothing is hand-written per film. Results are
   cached per film in localStorage and stay fresh for 12 hours. */
const LS_PROVIDERS='movie.providers.v1';
const PROVIDER_TTL=12*60*60*1000;
let provCache=null;
const provInflight={};
function provLoad(){
  if(provCache) return provCache;
  try{ provCache=JSON.parse(storeGet(LS_PROVIDERS)||'{}'); if(!provCache || typeof provCache!=='object') provCache={}; }
  catch(e){ provCache={}; }
  return provCache;
}
function provSave(){ try{ storeSet(LS_PROVIDERS, JSON.stringify(provCache)); }catch(e){} }
function provBaseNames(list){
  /* API display order, deduped by base name; an ads-only variant is
     shown as 「（広告付き）」, a plain variant wins over the ads one. */
  const order=[], plain={}, ads={};
  for(const p of (list||[])){
    let n=(p && p.provider_name) || '';
    if(!n) continue;
    let isAds=false;
    if(/ with Ads$/i.test(n)){ isAds=true; n=n.replace(/ with Ads$/i,''); }
    if(order.indexOf(n)<0) order.push(n);
    if(isAds){ if(!plain[n]) ads[n]=true; } else { plain[n]=true; delete ads[n]; }
  }
  return order.map(n=> ads[n] ? n+'（広告付き）' : n);
}
async function fetchProviders(tmdbId){
  const c=provLoad();
  const ent=c['p'+tmdbId];
  if(ent && (Date.now()-ent.at)<PROVIDER_TTL) return ent;
  if(!getTmdbToken()) return null;
  if(provInflight[tmdbId]) return provInflight[tmdbId];
  const pr=(async()=>{
    try{
      const j=await tmdbFetch('/movie/'+tmdbId+'/watch/providers');
      const jp=(j && j.results && j.results.JP) || null;
      const e={ at:Date.now(), hasJP:!!jp,
        flatrate: jp ? provBaseNames(jp.flatrate) : [],
        rent: jp ? provBaseNames(jp.rent) : [],
        buy: jp ? provBaseNames(jp.buy) : [] };
      c['p'+tmdbId]=e; provSave();
      return e;
    }catch(err){ return null; }
  })();
  provInflight[tmdbId]=pr;
  pr.then(()=>{ delete provInflight[tmdbId]; });
  return pr;
}
function provLineText(e){
  if(e.flatrate && e.flatrate.length) return '配信：'+e.flatrate.join('／');
  if((e.rent && e.rent.length) || (e.buy && e.buy.length)) return 'サブスクなし（レンタルあり）';
  return '配信なし（日本）';
}
function provDetailText(e){
  const lines=[];
  if(e.flatrate && e.flatrate.length) lines.push('サブスク：'+e.flatrate.join('／'));
  if(e.rent && e.rent.length) lines.push('レンタル：'+e.rent.join('／'));
  if(e.buy && e.buy.length) lines.push('購入：'+e.buy.join('／'));
  if(!lines.length) lines.push('日本での配信・レンタル・購入情報なし');
  const d=new Date(e.at);
  lines.push('日本・TMDb（JustWatch）調べ／'+(d.getMonth()+1)+'/'+d.getDate()+'取得');
  return lines.join('\n');
}
async function fillLbProv(tmdbId){
  const lp=$('lbprov'); if(!lp) return;
  if(!tmdbId || !getTmdbToken()){ lp.textContent=''; return; }
  const e=await fetchProviders(tmdbId);
  const lb=$('lightbox');
  if(!lb || !lb.classList.contains('open')) return;
  lp.textContent = e ? provDetailText(e) : '';
}
async function resolveProvId(title, origTitle, year){
  /* free-text films: one title(+year) search resolve, cached either way */
  const c=provLoad();
  const ck='r'+(title||'')+'|'+(year||'');
  if(ck in c) return c[ck] || null;
  let found=null;
  const queries=[title];
  if(origTitle && origTitle!==title) queries.push(origTitle);
  for(const q of queries){
    if(!q) continue;
    try{
      const j=await tmdbFetch('/search/movie?language=ja-JP&include_adult=false&query='+encodeURIComponent(q));
      const rs=j.results||[];
      const hit = year ? rs.find(m=>m.release_date && parseInt(m.release_date.slice(0,4),10)===year) : rs[0];
      if(hit){ found=hit.id; break; }
    }catch(e){ /* stays unresolved */ }
  }
  c[ck]=found||0; provSave();
  return found;
}
function scanProviders(){
  if(!getTmdbToken()) return;
  document.querySelectorAll('.provtop[data-tmdb]:not([data-done])').forEach(el=>{
    el.setAttribute('data-done','1');
    const id=parseInt(el.getAttribute('data-tmdb'),10);
    if(!id) return;
    fetchProviders(id).then(e=>{ if(e) el.textContent=(e.flatrate && e.flatrate.length) ? e.flatrate[0] : ''; });
  });
  document.querySelectorAll('.provline[data-tmdb]:not([data-done])').forEach(el=>{
    el.setAttribute('data-done','1');
    const id=parseInt(el.getAttribute('data-tmdb'),10);
    if(!id) return;
    fetchProviders(id).then(e=>{ if(e) el.textContent=provLineText(e); });
  });
  document.querySelectorAll('.provline[data-resolve]:not([data-done])').forEach(el=>{
    el.setAttribute('data-done','1');
    const yr=parseInt(el.getAttribute('data-ryear')||'',10);
    resolveProvId(el.getAttribute('data-rtitle')||'', el.getAttribute('data-rorig')||'', isNaN(yr)?null:yr).then(id=>{
      if(!id) return;
      fetchProviders(id).then(e=>{ if(e) el.textContent=provLineText(e); });
    });
  });
}
function tmdbIdForFilm(f){
  if(f && typeof f.tmdbId==='number') return f.tmdbId;
  if(f && f.catalogKey && CATALOG_BY_KEY[f.catalogKey]) return CATALOG_BY_KEY[f.catalogKey].tmdbId || null;
  return null;
}

    p.innerHTML = panelShell('TMDb連携',
      '<div class="setbox"><div class="setlabel">API Read Access Token</div>'+
      '<input class="textin" id="tmdb-token-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="トークンを貼り付け" value="'+escA(tok)+'">'+
      '<div class="btnrow"><button class="btn primary" onclick="saveTmdbToken()">保存</button><button class="btn" onclick="clearTmdbToken()">消去</button></div>'+
      (tok ? '' : '<div class="note">配信情報の表示にはTMDbトークンが必要です</div>')+
      '<div class="note">トークンはこの端末内にだけ保存され、Driveには同期されません。映画検索と、各映画の配信情報（どのサブスクで観られるか）の取得に使います。</div></div>');
  }
  else if(settingsPanel==='data'){
    p.innerHTML = panelShell('データ',
      '<div class="setbox"><div class="setlabel">データのインポート</div>'+
      '<div class="note" style="margin-top:0">移行用ファイル（movie.json と同じ形式の JSON）を読み込み、今のデータを置き換えます。一度だけ使う想定の機能です。</div>'+
      '<div class="btnrow"><button class="btn" onclick="document.getElementById(\'importfile\').click()">JSONファイルを読み込む</button></div></div>');
  }
  else if(settingsPanel==='about'){
    p.innerHTML = panelShell('このアプリについて',
      '<div class="setbox">'+
      '<div class="note" style="margin:0">Cinelabo v'+APP_VERSION+' ／ データは端末内と、接続時はあなたの Google Drive に保存されます。</div>'+
      '<div class="note">This product uses the TMDB API but is not endorsed or certified by TMDB.</div></div>');
  }
}
function saveTmdbToken(){
  const v=($('tmdb-token-in').value||'').trim();
  if(v) storeSet(LS_TMDB, v); else storeDel(LS_TMDB);
  renderSettings(); renderInput();
  alert('保存しました。');
}
function clearTmdbToken(){ storeDel(LS_TMDB); renderSettings(); renderInput(); }
function importDataFile(input){
  const file=input && input.files && input.files[0];
  input.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const parsed=JSON.parse(String(reader.result||''));
      if(!parsed || !Array.isArray(parsed.films)) throw new Error('形式が違います');
      const d=normalizeData(parsed);
      if(!d) throw new Error('形式が違います');
      if(!confirm('今のデータを、読み込んだデータ（映画'+d.films.length+'件）で置き換えますか？')) return;
      DB=d;
      DB.updatedAt=Date.now(); /* imported data wins the next sync and uploads */
      saveLocal(); scheduleSync(); renderAll();
      alert('インポートしました（映画'+DB.films.length+'件）。');
    }catch(e){
      alert('読み込めませんでした：'+((e && e.message) ? e.message : e));
    }
  };
  reader.readAsText(file);
}

/* ================= navigation ================= */
const NAV_VIEWS=['home','calendar','stubs','works','stats'];
const ALL_VIEWS=['home','calendar','stubs','works','stats','criteria','input','settings'];
let currentView='home';
function viewTitleHTML(name){
  const Y=new Date().getFullYear();
  switch(name){
    case 'home': return 'CINELABO<span class="ayr">'+Y+'</span>';
    case 'calendar': return 'CALENDAR<span class="ajp">カレンダー</span>';
    case 'stubs': return 'STUBS<span class="ajp">半券</span>';
    case 'works': return 'WORKS<span class="ajp">作品</span>';
    case 'stats': return 'STATISTICS<span class="ajp">統計</span>';
    case 'criteria': return 'CRITERIA<span class="ajp">判定基準</span>';
    case 'input': return 'TASTE<span class="ajp">好み入力</span>';
    case 'settings': return 'SETTINGS<span class="ajp">設定</span>';
  }
  return 'CINELABO';
}
function showView(name){
  const prev=currentView;
  currentView=name;
  ALL_VIEWS.forEach(v=>{
    const el=$('view-'+v); if(!el) return;
    const on=(v===name);
    el.classList.toggle('active', on);
    el.classList.remove('slide-fwd','slide-back','fadein');
    if(on && prev!==name){
      const di=ALL_VIEWS.indexOf(name), pi=ALL_VIEWS.indexOf(prev);
      el.classList.add(di>pi?'slide-fwd':(di<pi?'slide-back':'fadein'));
    }
    const nav=$('nav-'+v); if(nav) nav.classList.toggle('on', on);
  });
  ['criteria','input','settings'].forEach(v=>{
    const hb=$('hb-'+v); if(hb) hb.classList.toggle('on', v===name);
  });
  const tt=$('apptitle'); if(tt) tt.innerHTML=viewTitleHTML(name);
  const fab=$('fab');
  if(fab) fab.style.display = NAV_VIEWS.indexOf(name)>=0 ? '' : 'none';
  try{ window.scrollTo(0,0); }catch(e){}
  if(name==='home') renderHome();
  if(name==='calendar') renderCalendar();
  if(name==='stubs') renderStubs();
  if(name==='works') renderLibrary();
  if(name==='stats') renderStats();
  if(name==='settings') renderSettings();
  pinNav();
}
function renderAll(){
  for(const k in renderedRev) delete renderedRev[k];
  renderHome(); renderCalendar(); renderStubs(); renderLibrary(); renderStats();
  renderCriteria(); renderInput(); renderSettings();
}

/* ================= tab bar pinning (diary pattern, adapted to the full-width bar) ================= */
function pinNav(){
  /* iOS standalone shrinks the fixed-position frame when the page is not
     scrollable, floating the bar up. Measure the real gap to the screen
     bottom and push the bar down so it always sits flush at the bottom. */
  const nav=$('tabbar'); if(!nav || nav.style.display==='none') return;
  nav.style.bottom='0px';
  const gap=window.innerHeight - nav.getBoundingClientRect().bottom;
  if(Math.abs(gap)>2) nav.style.bottom=(-gap)+'px';
  const ch=$('chev');
  if(ch){
    ch.style.bottom='';
    const nb=nav.getBoundingClientRect();
    ch.style.bottom=(window.innerHeight - nb.top)+'px';
  }
}
function healNav(){
  const nav=$('tabbar'); if(!nav || nav.style.display==='none') return;
  pinNav();
  nav.style.opacity='0.99';
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ nav.style.opacity=''; }); });
}
let navHealTimer=null;
window.addEventListener('resize', ()=>{ pinNav(); });
window.addEventListener('scroll', ()=>{ if(navHealTimer) clearTimeout(navHealTimer); navHealTimer=setTimeout(healNav, 160); }, { passive:true });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setTimeout(healNav, 60); });

/* ================= Drive sync (中継 / Apps Script only) =================
   Since v1.11 the relay is the sole transport; the old GIS (Google
   login) route was removed. The relay, deployed under the user's own
   Google account, reads and writes movie.json on Drive (server-side
   name allowlist + shared secret), so sync needs no login at all and
   the connection can never lapse. URL + secret live only in this
   device's localStorage. In relay mode a file's "id" is its name. */
const DRIVE_FILE_NAME='movie.json';
let syncStatus='disconnected'; /* disconnected | syncing | synced | error */
let syncMsg='';
let lastSyncAt=0;
let syncTimer=null;
let syncRunning=false;

function setSyncStatus(st, msg){
  syncStatus=st; if(typeof msg==='string') syncMsg=msg;
  renderSyncStatus();
}
function renderSyncStatus(){
  let label, cls='';
  if(syncStatus==='synced') label='同期済み'+(lastSyncAt ? '（'+pad2(new Date(lastSyncAt).getHours())+':'+pad2(new Date(lastSyncAt).getMinutes())+'）' : '');
  else if(syncStatus==='syncing') label='同期中…';
  else if(syncStatus==='error'){ label='同期エラー'+(syncMsg ? '：'+syncMsg : ''); cls='err'; }
  else if(relayReady()) label='中継で接続済み（未同期）';
  else label='中継未設定（端末内に保存中）';
  const dot=$('syncdot');
  if(dot) dot.style.background = (relayReady() && syncStatus!=='error') ? '#46a758' : '#e5484d';
  const bar=$('syncbar');
  if(bar){
    let hint='';
    if(syncStatus==='syncing') hint='';
    else if(syncStatus==='error') hint=' ・ <span class="sbhint">タップで再試行</span>';
    else if(relayReady()) hint=' ・ <span class="sbhint">タップで再同期</span>';
    else hint=' ・ <span class="sbhint">タップで設定</span>';
    bar.innerHTML='<span class="'+cls+'">'+esc(label)+'</span>'+hint;
  }
  const st=$('syncstat'); if(st) st.innerHTML='<span class="'+cls+'">'+esc(label)+'</span>';
  const pill=$('syncpill');
  if(pill){
    pill.textContent = syncStatus==='synced' ? '同期済み' : (syncStatus==='syncing' ? '同期中…' : (syncStatus==='error' ? '同期エラー' : (relayReady() ? '中継で接続済み' : '未設定')));
    pill.className='syncpill'+(syncStatus==='synced'?' ok':(syncStatus==='error'?' err':''));
  }
}
function onSyncBarTap(){
  if(syncStatus==='syncing' || syncRunning) return;
  if(relayReady()){ syncNow('manual'); return; }
  /* not configured: take the user to the relay settings */
  showView('settings');
  openSettingsPanel('drive');
}
function scheduleSync(){
  if(!relayReady()) return;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{ syncNow('auto'); }, 1500);
}
const LS_RELAY='movie.relay';
const RELAY_URL_DEFAULT='https://script.google.com/macros/s/AKfycbziV1Wpv7AWSUJJgaKyRzFeBR81Td4CjryGGuq4avt1xAo-e2mbeyS2vBpCuqx4_KI/exec';
function relayCfg(){ try{ const r=JSON.parse(storeGet(LS_RELAY)||'null'); return (r && r.secret) ? { url: r.url || RELAY_URL_DEFAULT, secret: r.secret } : null; }catch(e){ return null; } }
function relayReady(){ return !!relayCfg(); }
async function relayCall(op, name, content){
  const c=relayCfg(); if(!c) throw new Error('中継が未設定です');
  const res=await fetch(c.url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ secret:c.secret, op:op, name:name, content:content }) });
  if(!res.ok) throw new Error('中継 HTTP '+res.status);
  const j=JSON.parse(await res.text());
  if(!j || !j.ok) throw new Error('中継エラー：'+((j && j.error) || 'unknown'));
  return j;
}
function relaySaveAndTest(){
  const u=$('relay-url-in'), s=$('relay-secret-in'), st=$('relaystat');
  const url=(u ? u.value : '').trim() || RELAY_URL_DEFAULT, secret=(s ? s.value : '').trim();
  if(!secret){ if(st) st.textContent='シークレットを入力してください（URLは入力済みです）'; return; }
  storeSet(LS_RELAY, JSON.stringify({ url:url, secret:secret }));
  if(st) st.textContent='接続テスト中…';
  relayCall('ping').then(()=>{
    if(st) st.textContent='接続OK — 中継で同期します。';
    renderSyncStatus();
    syncNow('relay');
  }).catch(e=>{ if(st) st.textContent='接続に失敗しました：'+((e && e.message) || e); });
}
function relayClear(){
  storeDel(LS_RELAY);
  setSyncStatus('disconnected');
  renderSettings();
}
async function findMovieFile(){
  const j=await relayCall('stat', DRIVE_FILE_NAME);
  return j.exists ? { id:DRIVE_FILE_NAME, name:DRIVE_FILE_NAME } : null;
}
async function downloadMovie(fileId){
  const j=await relayCall('get', DRIVE_FILE_NAME);
  return normalizeData(JSON.parse(j.content));
}
async function uploadMovieUpdate(fileId, data){
  await relayCall('put', DRIVE_FILE_NAME, JSON.stringify(data));
}
async function createMovie(data){
  await relayCall('put', DRIVE_FILE_NAME, JSON.stringify(data));
  return { id:DRIVE_FILE_NAME };
}
async function syncNow(reason){
  if(syncRunning) return;
  if(!relayReady()){ setSyncStatus('disconnected'); return; }
  syncRunning=true; setSyncStatus('syncing');
  try{
    const file=await findMovieFile();
    if(!file){
      await createMovie(DB); /* the app itself creates movie.json on first connect */
    } else {
      const remote=await downloadMovie(file.id);
      if(remote && remote.updatedAt>DB.updatedAt){
        DB=remote; saveLocal(); renderAll();
      } else if(DB.updatedAt>(remote?remote.updatedAt:0)){
        await uploadMovieUpdate(file.id, DB);
      }
    }
    lastSyncAt=Date.now();
    setSyncStatus('synced');
  }catch(e){
    setSyncStatus('error', (e && e.message) ? e.message : String(e));
  }finally{
    syncRunning=false;
  }
}

/* ================= self update ================= */
const APP_VERSION='2.1';
{ const vb=$('verBadge'); if(vb) vb.textContent='v'+APP_VERSION; }
function splashGo(){
  const sp=$('splash'); if(!sp || sp.dataset.went) return; sp.dataset.went='1';
  sp.classList.remove('wait'); sp.classList.add('hide');
  setTimeout(()=>{ try{ sp.remove(); }catch(e){} }, 520);
}
function checkForUpdate(){
  try{
    fetch(location.pathname+'?cv='+Date.now(), { cache:'no-store' })
      .then(r=>r.text())
      .then(t=>{
        const m=t.match(/name="app-version" content="([0-9.]+)"/);
        if(!m){ splashGo(); return; }
        const latest=m[1];
        if(latest===APP_VERSION){ splashGo(); return; }
        let tried=null;
        try{ tried=sessionStorage.getItem('movie.updateTried'); }catch(e){}
        if(tried===latest){ splashGo(); return; }
        try{ sessionStorage.setItem('movie.updateTried', latest); }catch(e){}
        location.replace(location.pathname+'?u='+Date.now());
      })
      .catch(()=>{ splashGo(); });
  }catch(e){ splashGo(); }
}
let hiddenAt=0;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ hiddenAt=Date.now(); return; }
  if(hiddenAt && Date.now()-hiddenAt>=60000) checkForUpdate();
});
/* iOS :active support */
document.addEventListener('touchstart', function(){}, { passive:true });

/* ================= init ================= */
(function init(){
  loadLocal();
  const sp=$('splash');
  if(sp){
    sp.addEventListener('click', splashGo);
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) splashGo();
    setTimeout(splashGo, 1500);
    setTimeout(()=>{ try{ sp.remove(); }catch(e){} }, 2800);
  }
  renderAll();
  requestAnimationFrame(()=>{ pinNav(); });
  renderSyncStatus();
  if(relayReady()){
    /* a configured relay needs no login — sync on open. */
    setTimeout(()=>syncNow('startup'), 300);
  }
  checkForUpdate();
})();
</script>
