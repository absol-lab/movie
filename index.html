<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="2.3">
<title>Cinelabo</title>
<link rel="icon" type="image/png" href="IMG_2555.png">
<link rel="apple-touch-icon" href="IMG_2555.png">
<meta name="application-name" content="Cinelabo">
<meta name="apple-mobile-web-app-title" content="Cinelabo">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141210">
<style>
:root{ --bg:#141210; --panel:#1e1a17; --panel2:#262019; --line:#3a332a; --line2:#2c2620; --tx:#ece5d8; --sub:#a99e8c; --acc:#d8a24a; --acc2:#7fb0a5; --red:#e5484d; --green:#46a758; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; background:var(--bg); color:var(--tx); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; touch-action:manipulation; }
html{ background:#141210; }
body{ padding-bottom:96px; font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%; }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0; }
input,textarea,select{ font:inherit; color:inherit; }
a{ color:var(--acc); }
/* ---------- splash (pure-black fade veil) ---------- */
#splash{ position:fixed; inset:0; background:#000; z-index:200; transition:opacity .45s ease; }
#splash.hide{ opacity:0; pointer-events:none; }
/* ---------- header (Musilabo top bar) ---------- */
header{ position:sticky; top:0; z-index:20; background:rgba(20,18,16,.92); backdrop-filter:blur(8px); padding:10px 14px 8px; border-bottom:1px solid var(--line); }
h1{ font-size:1.06em; margin:0; letter-spacing:.14em; font-weight:700; }
h1 .en{ color:var(--acc); font-size:.72em; letter-spacing:.22em; margin-left:8px; }
#syncbar{ display:flex; align-items:center; gap:7px; margin-top:7px; background:none; border:none; color:var(--sub); font-size:.8em; padding:4px 0; cursor:pointer; text-align:left; width:100%; }
#syncdot{ width:8px; height:8px; border-radius:50%; background:var(--red); flex:none; }
#syncbar .err{ color:var(--red); }
.hrow{ display:flex; align-items:center; gap:10px; }
#savetime{ margin-left:auto; color:var(--sub); font-size:.72em; white-space:nowrap; letter-spacing:.04em; }
#bellbtn{ position:relative; width:40px; height:40px; flex:none; border-radius:999px; border:1px solid var(--line); background:var(--panel); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--tx); }
#bellbtn svg{ width:20px; height:20px; }
#bellbadge{ position:absolute; top:-4px; right:-4px; min-width:17px; height:17px; padding:0 4px; border-radius:999px; background:var(--red); color:#fff; font-size:10px; font-weight:800; line-height:1; display:none; align-items:center; justify-content:center; }
#bellbadge.on{ display:flex; }
.sbhint{ color:var(--acc); }
/* ---------- views ---------- */
main{ padding:12px 14px 0; max-width:640px; margin:0 auto; position:relative; }
.view{ display:none; touch-action:pan-y; }
.view.on{ display:block; }
.view.enter-r{ animation:enterR .28s cubic-bezier(.3,.9,.3,1); position:relative; z-index:2; }
.view.enter-l{ animation:enterL .28s cubic-bezier(.3,.9,.3,1); position:relative; z-index:2; }
.view.leaving,.view.underlay{ display:block; position:absolute; top:12px; left:14px; right:14px; pointer-events:none; z-index:1; }
.view.exit-l{ animation:exitL .24s ease forwards; }
.view.exit-r{ animation:exitR .24s ease forwards; }
.view.swiping{ position:relative; z-index:2; }
@keyframes enterR{ from{ transform:translateX(56px); opacity:0; } to{ transform:none; opacity:1; } }
@keyframes enterL{ from{ transform:translateX(-56px); opacity:0; } to{ transform:none; opacity:1; } }
@keyframes exitL{ to{ transform:translateX(-26%); opacity:.35; } }
@keyframes exitR{ to{ transform:translateX(26%); opacity:.35; } }
@keyframes fadein{ from{ opacity:0; transform:translateX(8px);} to{ opacity:1; transform:none;} }
@media (prefers-reduced-motion: reduce){ .view.enter-r,.view.enter-l,.view.exit-l,.view.exit-r{ animation:none; } #splash{ transition:none; } }
/* ---------- generic (Musilabo) ---------- */
.secttl{ font-size:1em; margin:16px 2px 8px; letter-spacing:.06em; font-weight:700; }
.secttl:first-child{ margin-top:2px; }
.note{ color:var(--sub); font-size:.83em; line-height:1.65; margin:6px 2px; }
.card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
.btn{ appearance:none; border:1px solid var(--line); background:var(--panel2); color:var(--tx); border-radius:999px; padding:11px 18px; min-height:48px; font-size:.85em; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
.btn.primary{ background:var(--acc); border-color:var(--acc); color:#1c1508; font-weight:700; }
.btn.small{ min-height:44px; padding:8px 14px; font-size:.8em; }
.btn.on{ background:var(--acc); color:#1c1508; border-color:var(--acc); font-weight:700; }
.btn.danger{ color:var(--red); border-color:var(--red); }
.btnrow{ display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
textarea,input.textin,select.textin{ width:100%; background:#17140f; border:1px solid var(--line); border-radius:10px; color:var(--tx); padding:11px 12px; font-size:.92em; }
textarea{ min-height:56px; resize:vertical; }
.selin{ background:#17140f; border:1px solid var(--line); border-radius:10px; color:var(--tx); padding:9px 10px; font-size:.92em; }
.chiprow{ display:flex; gap:7px; flex-wrap:wrap; margin:8px 0 4px; }
.tagchip,.chip{ border:1px solid var(--line); background:var(--panel); color:var(--sub); border-radius:999px; padding:7px 13px; font-size:.8em; min-height:44px; cursor:pointer; display:inline-flex; align-items:center; }
.tagchip.on,.chip.on{ background:var(--acc); color:#1c1508; border-color:var(--acc); font-weight:700; }
span.tagchip,span.chip{ cursor:default; }
.axchips{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.axchip{ font-size:.68em; color:var(--sub); border:1px solid var(--line); border-radius:999px; padding:3px 8px; }
.empty{ color:var(--sub); font-size:.86em; padding:18px 12px; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; }
.libempty{ color:var(--sub); font-size:.86em; padding:14px 2px; }
/* ---------- poster (fixed 2:3 box, never stretches) ---------- */
.poster{ position:relative; flex:none; align-self:flex-start; aspect-ratio:2/3; border-radius:10px; overflow:hidden; background:var(--panel2); border:1px solid var(--line); cursor:pointer; padding:0; display:block; }
.poster .pfb{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:6px; text-align:center; font-size:11px; line-height:1.45; color:var(--sub); word-break:break-all; }
.poster img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
/* ---------- recommendation cards (Musilabo two-tier) ---------- */
.recrow{ display:flex; gap:12px; align-items:flex-start; }
.postwrap{ position:relative; flex:none; align-self:flex-start; }
.scorebox{ flex:none; width:58px; text-align:center; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:7px 0 5px; }
.scorebox .num{ font-size:24px; font-weight:800; color:var(--acc); line-height:1; }
.scorebox .lbl{ font-size:9px; color:var(--sub); margin-top:3px; letter-spacing:.1em; }
.postwrap .scorebox{ position:absolute; left:6px; bottom:6px; width:auto; background:rgba(18,15,12,.88); border-radius:10px; padding:3px 9px 5px; }
.postwrap .scorebox .num{ font-size:20px; }
.atitle{ font-size:15px; font-weight:700; line-height:1.35; }
.ftitle{ font-size:15px; font-weight:700; line-height:1.35; }
.aartist,.forig{ color:var(--acc2); font-size:.86em; margin-top:1px; }
.ameta,.fmeta{ color:var(--sub); font-size:.76em; margin-top:3px; }
.areason{ font-size:.83em; line-height:1.6; margin-top:6px; color:#d9d0bf; }
.provline{ font-size:.8em; line-height:1.6; margin-top:5px; color:#cfc5b2; font-weight:600; }
.provline:empty{ display:none; }
.provline b{ color:var(--acc2); font-weight:700; }
.topbadge{ display:inline-block; font-size:.66em; border-radius:6px; padding:2px 7px; margin-bottom:8px; background:rgba(216,162,74,.14); color:var(--acc); border:1px solid rgba(216,162,74,.5); vertical-align:1px; }
.ranknum{ color:var(--acc); font-weight:800; font-size:.85em; margin-bottom:3px; }
.recfoot{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
.recfoot .btnrow{ margin-top:0; margin-left:auto; }
.axisbars{ margin-top:10px; }
.axisrow{ display:flex; align-items:center; gap:8px; margin-top:4px; font-size:.76em; }
.axisrow .al{ width:80px; flex:none; color:var(--sub); }
.axisrow .bar{ position:relative; flex:1; height:6px; background:var(--panel2); border:1px solid var(--line); border-radius:3px; }
.axisrow .fill{ position:absolute; left:0; top:0; bottom:0; background:var(--acc); border-radius:3px; }
.axisrow .tgt{ position:absolute; top:-3px; width:2px; height:12px; background:var(--acc2); }
.axisrow .av{ width:52px; flex:none; text-align:right; color:var(--tx); }
/* ---------- stars (display) ---------- */
.stars{ display:flex; gap:4px; margin-top:4px; align-items:center; }
.stars .st{ color:var(--acc); font-size:.9em; letter-spacing:1px; }
.stars .stnum{ font-weight:800; font-size:.86em; margin-left:3px; }
.stars .norating{ color:var(--sub); font-size:.78em; }
/* ---------- home hero counts ---------- */
.hero{ padding:14px 12px; }
.bignums{ display:flex; }
.bignum{ flex:1; }
.bignum + .bignum{ border-left:1px solid var(--line); padding-left:16px; }
.bignum .bn{ font-size:40px; font-weight:800; line-height:1.1; }
.bignum .bn .unit{ font-size:18px; color:var(--acc); font-weight:800; margin-left:3px; }
.bignum .bl{ font-size:.78em; color:var(--sub); letter-spacing:.06em; margin-top:2px; }
/* ---------- RECENT rows ---------- */
.recent{ display:flex; gap:10px; align-items:center; }
.recent .rmain{ flex:1; min-width:0; }
.recent .rside{ flex:none; text-align:right; }
.recent .rdate{ font-size:.8em; color:var(--sub); font-weight:700; }
.recent .provtop{ font-size:.8em; font-weight:700; color:var(--acc2); margin-top:1px; }
.recent .provtop:empty{ display:none; }
/* ---------- criteria ---------- */
.critrow{ padding:10px 0; border-bottom:1px solid var(--line); }
.critrow:last-child{ border-bottom:none; }
.crithead{ display:flex; align-items:baseline; gap:8px; }
.crithead .cl{ font-weight:700; font-size:.92em; }
.crithead .cv{ margin-left:auto; font-weight:800; color:var(--acc); }
.crithint{ font-size:.8em; color:var(--sub); margin-top:2px; line-height:1.6; }
input[type="range"]{ width:100%; min-height:44px; accent-color:var(--acc); }
/* ---------- input / library rows ---------- */
.librow{ display:flex; gap:10px; align-items:flex-start; }
.libmain{ flex:1; min-width:0; }
.fieldrow{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:6px; }
.fieldrow label{ font-size:.78em; color:var(--sub); display:flex; align-items:center; gap:6px; }
.fieldrow input[type="date"], .fieldrow input[type="text"].memo{ background:#17140f; border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:16px; color:var(--tx); color-scheme:dark; }
.fieldrow input[type="text"].memo{ flex:1; min-width:140px; }
.statusbadge{ display:inline-block; font-size:.66em; border-radius:6px; padding:2px 7px; margin-left:6px; vertical-align:1px; background:rgba(216,162,74,.14); color:var(--acc); border:1px solid rgba(216,162,74,.5); }
.searchrow{ display:flex; gap:8px; }
.searchrow .textin{ flex:1; }
.searchrow .btn{ flex:none; }
.tmdbrow{ display:flex; gap:10px; align-items:flex-start; }
.formgrid label{ display:block; font-size:.8em; color:var(--sub); margin:8px 0 4px; }
/* ---------- stubs （半券） ---------- */
.stubgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:4px; }
.stubp{ width:100%; }
.ribbon{ position:absolute; top:0; right:7px; z-index:2; background:var(--red); color:var(--tx); font-size:10px; font-weight:800; letter-spacing:.02em; padding:3px 5px 7px; line-height:1.15; text-align:center; clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%); }
.ribbon .rst{ color:#f5c66b; }
.datestrip{ position:absolute; left:0; bottom:7px; z-index:2; background:rgba(18,15,12,.88); color:var(--tx); font-size:10px; font-weight:700; letter-spacing:.06em; padding:2px 7px; }
.datestrip.none{ background:var(--panel2); color:var(--sub); }
/* ---------- calendar ---------- */
.calhead{ display:flex; align-items:center; gap:8px; margin:4px 0 10px; }
.calhead .cm{ font-size:1.15em; font-weight:800; }
.calnav{ width:44px; height:44px; flex:none; display:inline-flex; align-items:center; justify-content:center; color:var(--acc); font-size:26px; font-weight:800; line-height:1; background:none; border:none; cursor:pointer; }
.calcount{ margin-left:auto; background:var(--panel2); border:1px solid var(--line); color:var(--tx); font-size:.8em; font-weight:700; border-radius:999px; padding:3px 10px; }
.calgrid{ display:grid; grid-template-columns:repeat(7,1fr); border-top:1px solid var(--line); border-left:1px solid var(--line); background:var(--panel); border-radius:14px; overflow:hidden; }
.calwd{ text-align:center; font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--sub); padding:6px 0; border-right:1px solid var(--line2); border-bottom:1px solid var(--line); }
.calwd.sun{ color:var(--red); }
.calcell{ position:relative; aspect-ratio:3/4; border-right:1px solid var(--line2); border-bottom:1px solid var(--line2); overflow:hidden; }
.calcell .cald{ position:absolute; top:3px; left:5px; z-index:2; font-size:10.5px; font-weight:700; color:var(--sub); }
.calcell.hasfilm .cald{ background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:0 4px; color:var(--tx); }
.calcell.today{ box-shadow:inset 0 0 0 2px var(--acc); }
.calcell.today::after{ content:''; position:absolute; top:0; right:0; z-index:3; border-style:solid; border-width:0 13px 13px 0; border-color:transparent var(--acc) transparent transparent; }
.calcell .calposter{ position:absolute; inset:0; width:100%; height:100%; padding:0; display:block; background:var(--panel2); border:none; cursor:pointer; }
.calcell .calposter img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.calcell .calmore{ position:absolute; right:3px; bottom:3px; z-index:2; background:rgba(18,15,12,.88); color:var(--tx); font-size:9.5px; font-weight:800; padding:1px 5px; border-radius:6px; }
/* ---------- statistics ---------- */
.statnums{ display:flex; margin:8px 0 4px; }
.statnum{ flex:1; }
.statnum + .statnum{ border-left:1px solid var(--line); padding-left:16px; }
.statnum .n{ font-size:36px; font-weight:800; line-height:1.1; }
.statnum .n .unit{ font-size:16px; color:var(--acc); font-weight:800; margin-left:2px; }
.statnum .l{ font-size:.78em; color:var(--sub); letter-spacing:.06em; margin-top:2px; }
.vbars{ display:flex; align-items:flex-end; gap:5px; height:108px; margin-top:10px; }
.vbar{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
.vbar .vb{ width:100%; max-width:26px; background:#6e5a35; min-height:2px; border-radius:3px 3px 0 0; }
.vbar.max .vb{ background:var(--acc); }
.vbar .vl{ font-size:10px; color:var(--sub); margin-top:4px; font-weight:700; }
.vbar .vc{ font-size:10px; font-weight:800; margin-bottom:3px; }
.hbar{ display:flex; align-items:center; gap:9px; margin-top:7px; font-size:.82em; }
.hbar .hl{ width:108px; flex:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
.hbar .ht{ position:relative; flex:1; height:13px; background:var(--panel2); border:1px solid var(--line); border-radius:4px; }
.hbar .hf{ position:absolute; left:0; top:0; bottom:0; background:#6e5a35; border-radius:4px; }
.hbar.max .hf{ background:var(--acc); }
.hbar .hv{ width:40px; flex:none; text-align:right; font-weight:800; }
.top3{ display:flex; align-items:flex-end; justify-content:center; gap:12px; margin-top:12px; }
.top3 .t3{ text-align:center; }
.top3 .t3rank{ font-size:20px; font-weight:800; color:var(--acc); margin-top:6px; line-height:1.1; }
.top3 .t3stars{ font-size:.8em; font-weight:700; }
.top3 .t3stars .st{ color:var(--acc); }
/* ---------- settings (grouped rows + panels) ---------- */
.syncstat{ font-size:.83em; color:var(--sub); line-height:1.65; }
.syncstat .err{ color:var(--red); }
.groupcard{ background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:10px; }
.setrow{ display:flex; align-items:center; gap:11px; width:100%; padding:12px 14px; min-height:52px; text-align:left; background:none; border:none; border-bottom:1px solid var(--line2); color:var(--tx); cursor:pointer; font-size:.95em; }
.setrow:last-child{ border-bottom:none; }
.setrow .sric{ flex:none; width:22px; height:22px; display:flex; align-items:center; justify-content:center; color:var(--sub); }
.setrow .sric svg{ width:21px; height:21px; }
.setrow .srval{ margin-left:auto; color:var(--sub); font-size:.88em; white-space:nowrap; }
.setrow .srchev{ color:var(--sub); font-size:1.05em; flex:none; }
.optrow{ display:flex; align-items:center; width:100%; padding:13px 14px; min-height:52px; text-align:left; background:none; border:none; border-bottom:1px solid var(--line2); color:var(--tx); cursor:pointer; font-size:.95em; }
.optrow:last-child{ border-bottom:none; }
.optrow .optcheck{ margin-left:auto; color:var(--acc); font-weight:800; visibility:hidden; }
.optrow.on .optcheck{ visibility:visible; }
.ovpanel{ position:fixed; inset:0; z-index:60; background:var(--bg); display:none; overflow-y:auto; touch-action:pan-y; padding:calc(env(safe-area-inset-top, 0px) + 10px) 14px calc(env(safe-area-inset-bottom, 0px) + 28px); }
.ovpanel.open{ display:block; animation:enterR .28s cubic-bezier(.3,.9,.3,1); }
@media (prefers-reduced-motion: reduce){ .ovpanel.open{ animation:none; } }
.ovpanel .pin{ max-width:640px; margin:0 auto; }
.panelnav{ display:flex; align-items:center; gap:10px; margin:2px 0 12px; }
.backbtn{ display:inline-flex; align-items:center; gap:2px; min-height:44px; padding:8px 14px 8px 8px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--tx); font-size:.9em; cursor:pointer; }
.panelttl{ font-weight:700; font-size:1.02em; letter-spacing:.06em; }
.histitem{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
.histhead{ display:flex; align-items:baseline; gap:10px; }
.histv{ font-weight:800; color:var(--acc); }
.histd{ color:var(--sub); font-size:.8em; }
.histitem ul{ margin:8px 0 2px; padding-left:18px; }
.histitem li{ font-size:.88em; line-height:1.65; margin:2px 0; }
/* ---------- nav (Musilabo floating pill) ---------- */
#nav{ position:fixed; left:50%; transform:translateX(-50%); bottom:15px; width:calc(100vw - 92px); max-width:430px; height:56px; background:rgba(30,26,23,.9); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:999px; display:flex; z-index:30; overflow:hidden; }
#navind{ position:absolute; top:4px; bottom:4px; border-radius:999px; background:rgba(216,162,74,.22); border:1px solid rgba(216,162,74,.55); transition:left .45s cubic-bezier(.3,.9,.3,1), width .45s cubic-bezier(.3,.9,.3,1); }
#nav button{ flex:1; position:relative; z-index:1; background:none; border:none; color:var(--sub); height:100%; cursor:pointer; letter-spacing:.02em; font-size:10px; white-space:nowrap; padding:0 1px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
#nav button svg{ width:21px; height:21px; flex:none; }
#nav button.on{ color:var(--tx); font-weight:700; }
#verBadge{ position:fixed; top:calc(env(safe-area-inset-top, 0px) + 2px); left:50%; transform:translateX(-50%); z-index:39; font-size:11px; letter-spacing:.03em; color:rgba(236,229,216,.85); pointer-events:none; white-space:nowrap; }
/* ---------- lightbox ---------- */
#lightbox{ position:fixed; inset:0; z-index:120; background:rgba(10,8,6,.78); display:none; align-items:center; justify-content:center; padding:calc(env(safe-area-inset-top, 0px) + 20px) 18px calc(env(safe-area-inset-bottom, 0px) + 20px); }
#lightbox.open{ display:flex; animation:fadein .25s ease; }
.lbcard{ position:relative; width:100%; max-width:400px; max-height:88dvh; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px 18px 18px; text-align:center; }
#lightbox img{ max-width:78%; max-height:52dvh; object-fit:contain; border:1px solid var(--line); border-radius:10px; }
#lightbox .cap{ margin-top:14px; text-align:center; }
#lightbox .cap .t{ font-weight:800; font-size:1.05em; }
#lightbox .cap .m{ color:var(--sub); font-size:.82em; margin-top:2px; }

const CATALOG_BY_KEY = {};
CATALOG.forEach(f=>{ CATALOG_BY_KEY[f.key]=f; });

/* ================= data store ================= */
const LS_DATA='movieStandalone.data.v1';
const LS_TMDB='tmdb-read-token';
const DATA_VERSION=1;
/* Blank defaults only. Personal data (watched films, ratings, criteria) is
   NEVER embedded in this public file — it lives only in Drive movie.json
   (created by the app) and in this device's local storage. */
const DEFAULT_CRITERIA={ targets:{ shock:0, unease:0, beauty:0, aftertaste:0, gore:0, quiet:0, difficulty:0 }, maxGore:0, maxRuntime:0 };
function seedData(){
  return {
    version: DATA_VERSION,
    updatedAt: 0, /* 0 so real data adopted from Drive always wins on first sync */
    films: [],
    criteria: JSON.parse(JSON.stringify(DEFAULT_CRITERIA))
  };
}
function normalizeFilm(f){
  if(!f || typeof f!=='object') return null;
  return {
    id: f.id || genId(),
    catalogKey: f.catalogKey || null,
    tmdbId: (typeof f.tmdbId==='number') ? f.tmdbId : null,
    title: f.title || '',
    titleOrig: f.titleOrig || '',
    year: (typeof f.year==='number') ? f.year : null,
    director: f.director || '',
    runtime: (typeof f.runtime==='number') ? f.runtime : null,
    poster: f.poster || null,
    status: f.status==='want' ? 'want' : 'watched',
    rating: (typeof f.rating==='number') ? f.rating : null,
    memo: (typeof f.memo==='string') ? f.memo : null,
    watchedDate: f.watchedDate || null
  };
}
function normalizeData(d){
  if(!d || typeof d!=='object') return null;
  const c=(d.criteria && typeof d.criteria==='object') ? d.criteria : {};
  const t=(c.targets && typeof c.targets==='object') ? c.targets : {};
  const targets={};
  AXIS_KEYS.forEach(k=>{ targets[k]=(typeof t[k]==='number') ? t[k] : DEFAULT_CRITERIA.targets[k]; });
  return {
    version: DATA_VERSION,
    updatedAt: (typeof d.updatedAt==='number') ? d.updatedAt : 0,
    films: Array.isArray(d.films) ? d.films.map(normalizeFilm).filter(Boolean) : [],
    criteria: {
      targets: targets,
      maxGore: (typeof c.maxGore==='number') ? c.maxGore : DEFAULT_CRITERIA.maxGore,
      maxRuntime: (typeof c.maxRuntime==='number') ? c.maxRuntime : DEFAULT_CRITERIA.maxRuntime
    }
  };
}
let DB=null;
let dataRev=0;
const renderedRev={};
function loadLocal(){
  try{ const raw=storeGet(LS_DATA); if(raw){ const d=normalizeData(JSON.parse(raw)); if(d){ DB=d; return; } } }catch(e){}
  DB=seedData(); saveLocal();
}
let lastSaveAt=0; try{ lastSaveAt=parseInt(storeGet('movie.lastSaveAt')||'0',10)||0; }catch(e){}
function renderSaveTime(){
  const el=$('savetime'); if(!el) return;
  el.textContent= lastSaveAt ? ('保存 '+pad2(new Date(lastSaveAt).getHours())+':'+pad2(new Date(lastSaveAt).getMinutes())) : '';
}
function saveLocal(){
  try{ storeSet(LS_DATA, JSON.stringify(DB)); }catch(e){}
  lastSaveAt=Date.now();
  try{ storeSet('movie.lastSaveAt', String(lastSaveAt)); }catch(e){}
  renderSaveTime();
}
function touch(){ DB.updatedAt=Date.now(); dataRev++; saveLocal(); scheduleSync(); }
function filmById(id){ return DB.films.find(f=>f.id===id) || null; }
function filmByCatalogKey(key){ return DB.films.find(f=>f.catalogKey===key) || null; }
function posterFor(film){
  if(film.catalogKey && CATALOG_BY_KEY[film.catalogKey]) return CATALOG_BY_KEY[film.catalogKey].poster;
  return film.poster || null;
}
function runtimeFor(film){
  if(typeof film.runtime==='number') return film.runtime;
  if(film.catalogKey && CATALOG_BY_KEY[film.catalogKey]) return CATALOG_BY_KEY[film.catalogKey].runtime;
  return null;
}

/* ================= recommendations ================= */
function tasteProfile(){
  const rated=DB.films.filter(f=>f.status==='watched' && typeof f.rating==='number' && f.rating>=4 && f.catalogKey && CATALOG_BY_KEY[f.catalogKey]);
  if(!rated.length) return null;
  const avg={};
  AXIS_KEYS.forEach(k=>{ avg[k]=rated.reduce((s,f)=>s+CATALOG_BY_KEY[f.catalogKey].axes[k],0)/rated.length; });
  return { profile: avg, count: rated.length };
}
function computeRecommendations(){
  const tp=tasteProfile();
  const targets={};
  AXIS_KEYS.forEach(k=>{ targets[k]= tp ? (DB.criteria.targets[k]+tp.profile[k])/2 : DB.criteria.targets[k]; });
  const picks=[];
  for(const film of CATALOG){
    if(filmByCatalogKey(film.key)) continue; /* already in library (watched or want) */
    if(DB.criteria.maxRuntime>0 && film.runtime>DB.criteria.maxRuntime) continue;
    if(film.axes.gore>DB.criteria.maxGore) continue;
    const detail=AXES.map(a=>{
      const fv=film.axes[a.key], tv=targets[a.key];
      const closeness=Math.round((1-Math.abs(fv-tv)/5)*10)/10;
      return { key:a.key, label:a.label, filmValue:fv, targetValue:tv, closeness:closeness };
    });
    const score=Math.round(100*detail.reduce((s,d)=>s+d.closeness,0)/detail.length);
    const perfect=detail.filter(d=>d.closeness>=1);
    let reasons=perfect.slice(0,2);
    if(reasons.length<2){
      const rest=detail.filter(d=>d.closeness<1).sort((x,y)=>y.closeness-x.closeness);
      reasons=reasons.concat(rest.slice(0,2-reasons.length));
    }
    picks.push({ film:film, score:score, axisDetail:detail,
      reasons: reasons.map(d=>d.label+' '+fmt1(d.filmValue)+'（狙い '+fmt1(d.targetValue)+'）') });
  }
  picks.sort((a,b)=>b.score-a.score); /* stable: catalog order breaks ties, like the Space */
  return { picks:picks, blendedTargets:targets, profileCount: tp?tp.count:0, profileSource: tp?'blended':'criteria-only' };
}

/* ================= poster + lightbox ================= */
function posterHTML(posterUrl, title, width){
  const w=width||84;
  let inner='<span class="pfb">'+esc(title||'')+'</span>';
  if(posterUrl) inner+='<img src="'+escA(posterUrl)+'" alt="" loading="lazy" onerror="this.remove()">';
  return '<button type="button" class="poster" style="width:'+w+'px" data-poster="'+escA(posterUrl||'')+'" data-title="'+escA(title||'')+'" onclick="posterTap(this)" aria-label="ポスターを拡大">'+inner+'</button>';
}
function posterTap(el){
  const url=el.getAttribute('data-poster');
  const title=el.getAttribute('data-title')||'';
  if(!url) return;
  openLightbox(url, title, el.getAttribute('data-meta')||'');
  const tid=el.getAttribute('data-tmdb');
  fillLbProv(tid ? parseInt(tid,10) : null);
}
function enlargeUrl(url){ return url ? url.replace('/t/p/w342/','/t/p/w780/').replace('/t/p/w185/','/t/p/w780/') : url; }
function openLightbox(url, title, meta){
  const lb=$('lightbox'); if(!lb) return;
  const img=$('lbimg');
  const big=enlargeUrl(url);
  img.style.opacity='1';
  img.onerror=function(){ img.style.opacity='0'; };
  img.onload=function(){ img.style.opacity='1'; };
  img.src=url; /* the already-loaded small poster shows instantly (no black void) */
  if(big && big!==url){
    const pre=new Image();
    pre.onload=function(){ img.src=big; };
    /* on failure the small poster simply stays */
    pre.src=big;
  }
  $('lbtitle').textContent=title||'';
  $('lbmeta').textContent=meta||'';
  const lp=$('lbprov'); if(lp) lp.textContent='';
  lb.classList.add('open');
}
function closeLightbox(){ const lb=$('lightbox'); if(lb) lb.classList.remove('open'); }
function posterWithMeta(posterUrl, title, meta, width, tmdbId){
  const html=posterHTML(posterUrl, title, width);
  return html.replace('onclick="posterTap(this)"', 'data-meta="'+escA(meta||'')+'"'+(tmdbId?' data-tmdb="'+tmdbId+'"':'')+' onclick="posterTap(this)"');
}
function metaLine(f){
  const parts=[];
  if(f.year) parts.push(f.year+'年');
  if(f.director) parts.push(f.director);
  const rt=runtimeFor(f); if(rt) parts.push(rt+'分');
  return parts.join('／');
}

/* ================= shared bits ================= */
function ratingOptions(sel){
  let h='<option value="">未評価</option>';
  for(let v=0.5; v<=5.0001; v+=0.5){
    const val=Math.round(v*10)/10;
    h+='<option value="'+val+'"'+(sel===val?' selected':'')+'>★'+fmt1(val)+'</option>';
  }
  return h;
}
function axisBarsHTML(detail){
  let h='<div class="axisbars">';
  for(const d of detail){
    h+='<div class="axisrow"><span class="al">'+esc(d.label)+'</span>'+
      '<span class="bar"><span class="fill" style="width:'+(d.filmValue/5*100)+'%"></span>'+
      '<span class="tgt" style="left:calc('+(d.targetValue/5*100)+'% - 1px)"></span></span>'+
      '<span class="av">'+fmt1(d.filmValue)+' / '+fmt1(d.targetValue)+'</span></div>';
  }
  return h+'</div>';
}
function addCatalogFilm(key, status, rating){
  const c=CATALOG_BY_KEY[key]; if(!c) return;
  const ex=filmByCatalogKey(key);
  if(ex){ ex.status=status; if(typeof rating==='number') ex.rating=rating; touch(); renderAll(); return; }
  DB.films.push({ id:genId(), catalogKey:key, tmdbId:null, title:c.title, titleOrig:c.titleOrig, year:c.year, director:c.director, runtime:null, poster:null, status:status, rating:(typeof rating==='number')?rating:null, memo:null, watchedDate:null });
  touch(); renderAll();
}

/* ================= view: ホーム（おすすめ＋RECENT） ================= */
function starsHTML(r){
  if(typeof r!=='number') return '<span class="norating">未評価</span>';
  const full=Math.max(1, Math.round(r));
  return '<span class="st">'+'★'.repeat(full)+'</span><span class="stnum">'+fmt1(r)+'</span>';
}
function fmtDateShort(dstr){
  if(!dstr) return '—';
  const p=dstr.split('-');
  if(p.length!==3) return dstr;
  return parseInt(p[1],10)+'/'+parseInt(p[2],10);
}
function watchedSorted(){
  const idx={};
  DB.films.forEach((f,i)=>{ idx[f.id]=i; });
  return DB.films.filter(f=>f.status==='watched').sort((a,b)=>{
    const da=a.watchedDate||'', db=b.watchedDate||'';
    if(da!==db) return da<db ? 1 : -1; /* newest first, undated last */
    return idx[b.id]-idx[a.id]; /* later-added first within the same day */
  });
}
function recentRowHTML(f){

function renderHome(){
  const wrap=$('homewrap'); if(!wrap) return;
  if(renderedRev.home===dataRev) return;
  renderedRev.home=dataRev;
  const watched=DB.films.filter(f=>f.status==='watched');
  const want=DB.films.filter(f=>f.status==='want');
  const now=new Date(), Y=now.getFullYear(), ym=Y+'-'+pad2(now.getMonth()+1);
  const dated=watched.filter(f=>f.watchedDate);
  const thisYear=dated.filter(f=>f.watchedDate.indexOf(Y+'-')===0).length;
  const thisMonth=dated.filter(f=>f.watchedDate.indexOf(ym)===0).length;
  let n1, l1, n2, l2;
  if(dated.length){ n1=thisYear; l1='今年の鑑賞'; n2=thisMonth; l2='今月の鑑賞'; }
  else { n1=watched.length; l1='観た映画（通算）'; n2=want.length; l2='観たい映画'; }
  let h='<div class="card hero">'+
    '<div class="bignums">'+
    '<div class="bignum"><div class="bn">'+n1+'<span class="unit">本</span></div><div class="bl">'+l1+'</div></div>'+
    '<div class="bignum"><div class="bn">'+n2+'<span class="unit">本</span></div><div class="bl">'+l2+'</div></div>'+
    '</div></div>';
  /* RECENT */
  h+='<div class="secttl">最近観た</div>';
  const rec=watchedSorted().slice(0,5);
  h+= rec.length ? rec.map(recentRowHTML).join('') : '<div class="empty">まだ記録がありません</div>';
  /* おすすめ */
  h+='<div class="secttl">おすすめ</div>';
  const r=computeRecommendations();
  if(r.profileSource==='criteria-only'){
    h+='<div class="note">まだ好みプロフィールがありません（★4以上で評価した映画が種になります）。今は判定基準だけで選んでいます。「好み入力」で好きな映画を★4以上で登録すると、判定基準と半々で混ぜておすすめします。</div>';
  } else {
    h+='<div class="note">好みプロフィール（★4以上の'+r.profileCount+'本）と判定基準を半々で混ぜて選んでいます。</div>';
  }
  if(!r.picks.length){
    h+='<div class="empty">条件に合う未登録の映画がありません。判定基準の上限を緩めてみてください。</div>';
  } else {
    h+=recCardHTML(r.picks[0], true, 1);
    if(r.picks.length>1){
      h+='<div class="secttl">候補</div>';
      r.picks.slice(1,12).forEach((p,i)=>{ h+=recCardHTML(p, false, i+2); });
    }
  }
  wrap.innerHTML=h;
  scanProviders();
}

/* ================= view: カレンダー ================= */
let calY=null, calM=null;
function renderCalendar(){
  const wrap=$('calwrap'); if(!wrap) return;
  const now=new Date();
  if(calY===null){ calY=now.getFullYear(); calM=now.getMonth(); }
  const ckey=calY+'-'+calM;
  if(renderedRev.calendar===dataRev && renderedRev.calKey===ckey) return;
  renderedRev.calendar=dataRev; renderedRev.calKey=ckey;
  const byDay={};
  let undated=0;
  DB.films.filter(f=>f.status==='watched').forEach(f=>{
    if(f.watchedDate){ (byDay[f.watchedDate]=byDay[f.watchedDate]||[]).push(f); }
    else undated++;
  });
  const startDay=new Date(calY, calM, 1).getDay();
  const days=new Date(calY, calM+1, 0).getDate();
  const monthPrefix=calY+'-'+pad2(calM+1);
  let monthCount=0;
  Object.keys(byDay).forEach(k=>{ if(k.indexOf(monthPrefix)===0) monthCount+=byDay[k].length; });
  const todayStr=now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-'+pad2(now.getDate());
  let h='<div class="calhead"><button class="calnav" onclick="calMove(-1)" aria-label="前の月">‹</button>'+
    '<div class="cm">'+calY+'年'+(calM+1)+'月</div>'+
    '<button class="calnav" onclick="calMove(1)" aria-label="次の月">›</button>'+
    '<span class="calcount">'+monthCount+' 本</span></div>';
  h+='<div class="calgrid">';
  ['日','月','火','水','木','金','土'].forEach((w,i)=>{ h+='<div class="calwd'+(i===0?' sun':'')+'">'+w+'</div>'; });
  for(let i=0;i<startDay;i++) h+='<div class="calcell"></div>';
  for(let d=1; d<=days; d++){
    const ds=calY+'-'+pad2(calM+1)+'-'+pad2(d);
    const films=byDay[ds]||[];
    const f=films[0];
    h+='<div class="calcell'+(films.length?' hasfilm':'')+(ds===todayStr?' today':'')+'">';
    if(f){
      const p=posterFor(f), ptid=tmdbIdForFilm(f);
      h+='<button type="button" class="calposter" data-poster="'+escA(p||'')+'" data-title="'+escA(f.title||'')+'" data-meta="'+escA(metaLine(f))+'"'+(ptid?' data-tmdb="'+ptid+'"':'')+' onclick="posterTap(this)" aria-label="'+escA(f.title)+'">'+(p?'<img src="'+escA(p)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</button>';
      if(films.length>1) h+='<span class="calmore">+'+(films.length-1)+'</span>';
    }
    h+='<span class="cald">'+d+'</span></div>';
  }
  h+='</div>';
  if(undated) h+='<div class="note" style="margin-top:10px">日付未設定の観た映画が'+undated+'本あります（作品タブで鑑賞日を設定するとカレンダーに出ます）。</div>';
  wrap.innerHTML=h;
}
function calMove(d){
  calM+=d;
  if(calM<0){ calM=11; calY--; }
  if(calM>11){ calM=0; calY++; }
  delete renderedRev.calendar;
  renderCalendar();
}

/* ================= view: 統計 ================= */
let statsMode='months';
function setStatsMode(m){ statsMode=m; delete renderedRev.stats; renderStats(); }
function hbarHTML(label, val, max, suffix){
  const pct=max>0 ? Math.round(val/max*100) : 0;
  return '<div class="hbar'+(max>0 && val===max && val>0 ? ' max':'')+'"><span class="hl">'+esc(label)+'</span><span class="ht"><span class="hf" style="width:'+pct+'%"></span></span><span class="hv">'+val+(suffix||'')+'</span></div>';
}
function renderStats(){
  const wrap=$('statswrap'); if(!wrap) return;
  if(renderedRev.stats===dataRev && renderedRev.statsMode===statsMode) return;
  renderedRev.stats=dataRev; renderedRev.statsMode=statsMode;
  const watched=DB.films.filter(f=>f.status==='watched');
  const Y=new Date().getFullYear();
  let h='<div class="secttl">統計 <span style="color:var(--sub);font-size:.78em">— '+Y+'年</span></div>';
  h+='<div class="chiprow"><button class="tagchip'+(statsMode==='months'?' on':'')+'" onclick="setStatsMode(\'months\')">月ごと</button>'+
     '<button class="tagchip'+(statsMode==='years'?' on':'')+'" onclick="setStatsMode(\'years\')">年ごと</button></div>';
  /* headline numbers (whole library, always meaningful) */
  let rtSum=0, rtCount=0;
  watched.forEach(f=>{ const rt=runtimeFor(f); if(typeof rt==='number'){ rtSum+=rt; rtCount++; } });
  const rtH=Math.floor(rtSum/60), rtM=rtSum%60;
  h+='<div class="statnums">'+
    '<div class="statnum"><div class="n">'+watched.length+'<span class="unit">本</span></div><div class="l">記録本数</div></div>'+
    '<div class="statnum"><div class="n">'+(rtCount ? rtH+'<span class="unit">時間</span>'+(rtM? rtM+'<span class="unit">分</span>':'') : '—')+'</div><div class="l">総鑑賞時間'+(rtCount?'（'+rtCount+'本分）':'')+'</div></div>'+
    '</div>';
  /* period bars */
  const dated=watched.filter(f=>f.watchedDate);
  if(statsMode==='months'){
    h+='<div class="secttl">'+Y+'年の月別本数</div>';
    if(dated.length){
      const counts=[];
      let mx=0;
      for(let m=0;m<12;m++){
        const c=dated.filter(f=>f.watchedDate.indexOf(Y+'-'+pad2(m+1))===0).length;
        counts.push(c); if(c>mx) mx=c;
      }
      h+='<div class="vbars">';
      counts.forEach((c,m)=>{
        h+='<div class="vbar'+(mx>0 && c===mx && c>0 ? ' max':'')+'">'+(c? '<span class="vc">'+c+'</span>' : '')+'<span class="vb" style="height:'+(mx>0 ? Math.max(4, Math.round(c/mx*64)) : 2)+'px"></span><span class="vl">'+(m+1)+'</span></div>';
      });
      h+='</div>';
    } else {
      h+='<div class="note">鑑賞日が設定された映画がまだありません（作品タブで鑑賞日を入れると集計されます）。</div>';
    }
  } else {
    h+='<div class="secttl">年別本数</div>';
    if(dated.length){
      const byYear={};
      dated.forEach(f=>{ const y=f.watchedDate.slice(0,4); byYear[y]=(byYear[y]||0)+1; });
      const ys=Object.keys(byYear).sort().reverse();
      const mx=Math.max.apply(null, ys.map(y=>byYear[y]));
      ys.forEach(y=>{ h+=hbarHTML(y+'年', byYear[y], mx, ' 本'); });
    } else {
      h+='<div class="note">鑑賞日が設定された映画がまだありません。</div>';
    }
  }
  /* star distribution */
  const rated=watched.filter(f=>typeof f.rating==='number');
  h+='<div class="secttl">星の分布</div>';
  if(rated.length){
    const buckets=[5,4.5,4,3.5,3,2.5,2,1.5,1,0.5].map(v=>({ v:v, c:rated.filter(f=>f.rating===v).length })).filter(b=>b.c>0);
    const mx=Math.max.apply(null, buckets.map(b=>b.c));
    buckets.forEach(b=>{ h+=hbarHTML('★'+fmt1(b.v), b.c, mx, ' 本'); });
  } else {
    h+='<div class="note">評価が付いた映画がまだありません。</div>';
  }
  /* providers (from the TMDb providers cache only) */
  h+='<div class="secttl">配信サービス別 <span style="color:var(--sub);font-size:.78em">— 取得済みの情報から</span></div>';
  const cache=provLoad();
  const svc={};
  watched.forEach(f=>{
    const id=tmdbIdForFilm(f); if(!id) return;
    const e=cache['p'+id];
    if(e && e.flatrate) e.flatrate.forEach(n=>{ svc[n]=(svc[n]||0)+1; });
  });
  const svcKeys=Object.keys(svc).sort((a,b)=>svc[b]-svc[a]).slice(0,8);
  if(svcKeys.length){
    const mx=Math.max.apply(null, svcKeys.map(k=>svc[k]));
    svcKeys.forEach(k=>{ h+=hbarHTML(k, svc[k], mx, ' 本'); });
  } else {
    h+='<div class="note">まだ集計できる配信情報がありません。作品の配信表示が取得されると、ここに集計されます。</div>';
  }
  /* genres / directors */
  const genres={}, dirs={};
  watched.forEach(f=>{
    if(f.catalogKey && CATALOG_BY_KEY[f.catalogKey]) (CATALOG_BY_KEY[f.catalogKey].genres||[]).forEach(g=>{ genres[g]=(genres[g]||0)+1; });
    if(f.director) dirs[f.director]=(dirs[f.director]||0)+1;
  });
  const gk=Object.keys(genres).sort((a,b)=>genres[b]-genres[a]).slice(0,12);
  if(gk.length){
    h+='<div class="secttl">よく観るジャンル</div><div class="chiprow">'+
      gk.map(g=>'<span class="tagchip">'+esc(g)+' '+genres[g]+'</span>').join('')+'</div>';
  }
  const dk=Object.keys(dirs).sort((a,b)=>dirs[b]-dirs[a]).slice(0,12);
  if(dk.length){
    h+='<div class="secttl">よく観る監督</div><div class="chiprow">'+
      dk.map(d=>'<span class="tagchip">'+esc(d)+' '+dirs[d]+'</span>').join('')+'</div>';
  }
  /* top 3 */
  const top=rated.slice().sort((a,b)=>b.rating-a.rating).slice(0,3);
  if(top.length){
    h+='<div class="secttl">高評価トップ3</div><div class="top3">';
    const order = top.length===3 ? [top[1], top[0], top[2]] : top;
    order.forEach(f=>{
      const rank=top.indexOf(f)+1;
      h+='<div class="t3">'+posterWithMeta(posterFor(f), f.title, metaLine(f), rank===1?92:72, tmdbIdForFilm(f))+
        '<div class="t3rank">'+rank+'</div><div class="t3stars"><span class="st">★</span>'+fmt1(f.rating)+'</div></div>';
    });
    h+='</div>';
  }
  /* hidden provider lines so the cache warms for the services section */
  if(getTmdbToken()){
    watched.forEach(f=>{ const id=tmdbIdForFilm(f); if(id) h+='<span class="provline" data-tmdb="'+id+'" style="display:none"></span>'; });
  }
  wrap.innerHTML=h;
  scanProviders();
}

/* ================= TMDb ================= */
let tmdbQuery='';
function getTmdbToken(){ return (storeGet(LS_TMDB)||'').trim(); }
async function tmdbFetch(path){
  const tok=getTmdbToken();
  const res=await fetch('https://api.themoviedb.org/3'+path, { headers:{ Authorization:'Bearer '+tok, Accept:'application/json' } });
  if(res.status===401) throw new Error('TMDbのトークンが無効です（401）。設定タブでトークンを確認してください。');
  if(!res.ok) throw new Error('TMDb検索に失敗しました（HTTP '+res.status+'）');
  return res.json();
}
async function doTmdbSearch(){
  const q=($('tmdbq').value||'').trim();
  tmdbQuery=q;
  if(!q){ tmdbMsg=''; tmdbResults=[]; renderInput(); return; }
  tmdbMsg='検索中…'; renderInput();
  const inp=$('tmdbq'); if(inp) inp.value=q;
  try{
    const j=await tmdbFetch('/search/movie?language=ja-JP&include_adult=false&query='+encodeURIComponent(q));
    const seen={}; const out=[];
    for(const m of (j.results||[])){ if(m && m.id && !seen[m.id]){ seen[m.id]=1; out.push(m); } }
    tmdbResults=out;
    tmdbMsg=out.length ? out.length+'件見つかりました' : '見つかりませんでした';
  }catch(e){
    tmdbResults=[]; tmdbMsg=(e && e.message) ? e.message : String(e);
  }
  renderInput();
  const inp2=$('tmdbq'); if(inp2) inp2.value=q;
}
async function registerTmdb(i){
  const m=tmdbResults[i]; if(!m) return;
  const sel=$('tmdb-rating-'+i);
  const rating=(sel && sel.value) ? parseFloat(sel.value) : null;
  let director='', runtime=null;
  try{
    const d=await tmdbFetch('/movie/'+m.id+'?language=ja-JP&append_to_response=credits');
    if(typeof d.runtime==='number') runtime=d.runtime;
    const crew=(d.credits && d.credits.crew) || [];
    const dir=crew.find(c=>c.job==='Director');
    if(dir) director=dir.name||'';
  }catch(e){ /* details are best-effort; registration still proceeds */ }
  DB.films.push({ id:genId(), catalogKey:null, tmdbId:m.id,
    title:m.title||m.original_title||'', titleOrig:m.original_title||'',
    year:m.release_date ? parseInt(m.release_date.slice(0,4),10) : null,
    director:director, runtime:runtime,
    poster: m.poster_path ? 'https://image.tmdb.org/t/p/w342'+m.poster_path : null,
    status:'watched', rating:rating, memo:null, watchedDate:null });

/* ================= watch providers (TMDb / JustWatch, region JP) =================
   Availability data comes only from TMDb's /watch/providers response
   (JustWatch-sourced). Nothing is hand-written per film. Results are
   cached per film in localStorage and stay fresh for 12 hours. */
const LS_PROVIDERS='movie.providers.v1';
const PROVIDER_TTL=12*60*60*1000;
let provCache=null;
const provInflight={};
function provLoad(){
  if(provCache) return provCache;
  try{ provCache=JSON.parse(storeGet(LS_PROVIDERS)||'{}'); if(!provCache || typeof provCache!=='object') provCache={}; }
  catch(e){ provCache={}; }
  return provCache;
}
function provSave(){ try{ storeSet(LS_PROVIDERS, JSON.stringify(provCache)); }catch(e){} }
function provBaseNames(list){
  /* API display order, deduped by base name; an ads-only variant is
     shown as 「（広告付き）」, a plain variant wins over the ads one. */
  const order=[], plain={}, ads={};
  for(const p of (list||[])){
    let n=(p && p.provider_name) || '';
    if(!n) continue;
    let isAds=false;
    if(/ with Ads$/i.test(n)){ isAds=true; n=n.replace(/ with Ads$/i,''); }
    if(order.indexOf(n)<0) order.push(n);
    if(isAds){ if(!plain[n]) ads[n]=true; } else { plain[n]=true; delete ads[n]; }
  }
  return order.map(n=> ads[n] ? n+'（広告付き）' : n);
}
async function fetchProviders(tmdbId){
  const c=provLoad();
  const ent=c['p'+tmdbId];
  if(ent && (Date.now()-ent.at)<PROVIDER_TTL) return ent;
  if(!getTmdbToken()) return null;
  if(provInflight[tmdbId]) return provInflight[tmdbId];
  const pr=(async()=>{
    try{
      const j=await tmdbFetch('/movie/'+tmdbId+'/watch/providers');
      const jp=(j && j.results && j.results.JP) || null;
      const e={ at:Date.now(), hasJP:!!jp,
        flatrate: jp ? provBaseNames(jp.flatrate) : [],
        rent: jp ? provBaseNames(jp.rent) : [],
        buy: jp ? provBaseNames(jp.buy) : [] };
      c['p'+tmdbId]=e; provSave();
      return e;
    }catch(err){ return null; }
  })();
  provInflight[tmdbId]=pr;
  pr.then(()=>{ delete provInflight[tmdbId]; });
  return pr;
}
function provLineText(e){
  if(e.flatrate && e.flatrate.length) return '配信：'+e.flatrate.join('／');
  if((e.rent && e.rent.length) || (e.buy && e.buy.length)) return 'サブスクなし（レンタルあり）';
  return '配信なし（日本）';
}
function provDetailText(e){
  const lines=[];
  if(e.flatrate && e.flatrate.length) lines.push('サブスク：'+e.flatrate.join('／'));
  if(e.rent && e.rent.length) lines.push('レンタル：'+e.rent.join('／'));
  if(e.buy && e.buy.length) lines.push('購入：'+e.buy.join('／'));
  if(!lines.length) lines.push('日本での配信・レンタル・購入情報なし');
  const d=new Date(e.at);
  lines.push('日本・TMDb（JustWatch）調べ／'+(d.getMonth()+1)+'/'+d.getDate()+'取得');
  return lines.join('\n');
}
async function fillLbProv(tmdbId){
  const lp=$('lbprov'); if(!lp) return;
  if(!tmdbId || !getTmdbToken()){ lp.textContent=''; return; }
  const e=await fetchProviders(tmdbId);
  const lb=$('lightbox');
  if(!lb || !lb.classList.contains('open')) return;
  lp.textContent = e ? provDetailText(e) : '';
}
async function resolveProvId(title, origTitle, year){
  /* free-text films: one title(+year) search resolve, cached either way */
  const c=provLoad();
  const ck='r'+(title||'')+'|'+(year||'');
  if(ck in c) return c[ck] || null;
  let found=null;
  const queries=[title];
  if(origTitle && origTitle!==title) queries.push(origTitle);
  for(const q of queries){
    if(!q) continue;
    try{
      const j=await tmdbFetch('/search/movie?language=ja-JP&include_adult=false&query='+encodeURIComponent(q));
      const rs=j.results||[];
      const hit = year ? rs.find(m=>m.release_date && parseInt(m.release_date.slice(0,4),10)===year) : rs[0];
      if(hit){ found=hit.id; break; }
    }catch(e){ /* stays unresolved */ }
  }
  c[ck]=found||0; provSave();
  return found;
}
function scanProviders(){
  if(!getTmdbToken()) return;
  document.querySelectorAll('.provtop[data-tmdb]:not([data-done])').forEach(el=>{
    el.setAttribute('data-done','1');
    const id=parseInt(el.getAttribute('data-tmdb'),10);
    if(!id) return;
    fetchProviders(id).then(e=>{ if(e) el.textContent=(e.flatrate && e.flatrate.length) ? e.flatrate[0] : ''; });
  });
  document.querySelectorAll('.provline[data-tmdb]:not([data-done])').forEach(el=>{
    el.setAttribute('data-done','1');
    const id=parseInt(el.getAttribute('data-tmdb'),10);
    if(!id) return;
    fetchProviders(id).then(e=>{ if(e) el.textContent=provLineText(e); });
  });
  document.querySelectorAll('.provline[data-resolve]:not([data-done])').forEach(el=>{
    el.setAttribute('data-done','1');
    const yr=parseInt(el.getAttribute('data-ryear')||'',10);
    resolveProvId(el.getAttribute('data-rtitle')||'', el.getAttribute('data-rorig')||'', isNaN(yr)?null:yr).then(id=>{
      if(!id) return;
      fetchProviders(id).then(e=>{ if(e) el.textContent=provLineText(e); });
    });
  });
}

/* ================= sound (WebAudio synthesized tap, diary pattern) ================= */
let AC=null;
function audioCtx(){
  if(!UI.sndOn) return null;
  if(!AC){
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(AC.state!=='running'){ try{ AC.resume(); }catch(e){} }
  return AC;
}
function tone(ac, f0, dur, peak, type){
  const t=ac.currentTime+0.02;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'triangle'; o.frequency.setValueAtTime(f0, t);
  const p=Math.max(peak*(UI.sndVol/100), 0.0001);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(p, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t+dur+0.05);
}
function playTap(){ if(!UI.sndOn) return; const ac=audioCtx(); if(!ac) return; tone(ac, 800, 0.03, 0.25, 'triangle'); }
document.addEventListener('pointerdown', function(){
  const ac=audioCtx(); if(!ac || AC._warmed) return; AC._warmed=true; tone(ac, 440, 0.02, 0.004, 'sine');
}, true);
document.addEventListener('pointerdown', function(e){
  if(!UI.sndOn) return;
  const t=e.target;
  const b=t && t.closest ? t.closest('button, a') : null;
  if(!b || b.disabled) return;
  playTap();
}, true);

/* ================= pill nav pinning (keeps the floating bar flush on short pages) ================= */
function pinNav(){
  /* iOS standalone shrinks the fixed-position frame when the page is not
     scrollable, floating fixed elements up. Measure the real gap to the
     screen bottom and push the pill down so it keeps its 15px footing. */
  const nav=$('nav'); if(!nav) return;
  nav.style.bottom='15px';
  const gap=(window.innerHeight-15) - nav.getBoundingClientRect().bottom;
  if(Math.abs(gap)>2) nav.style.bottom=(15-gap)+'px';
}
function healNav(){
  const nav=$('nav'); if(!nav) return;
  pinNav();
  nav.style.opacity='0.99';
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ nav.style.opacity=''; }); });
}

/* ================= swipe back (Pointer Events + direction lock + capture; template v1.2 pattern) ================= */
function swipeBack(el, followEl, underEl, onBack, canStart){
  if(!el || !followEl) return;
  let d=null;
  const ue=()=> (typeof underEl==='function') ? underEl() : underEl;
  el.addEventListener('pointerdown', e=>{
    if(e.pointerType==='mouse') return;
    if(e.target && e.target.closest && e.target.closest('input,textarea,select')) return;
    if(canStart && !canStart(e)) return;
    d={ id:e.pointerId, x0:e.clientX, y0:e.clientY, state:'maybe' };
  });
  el.addEventListener('pointermove', e=>{
    if(!d || e.pointerId!==d.id) return;
    const dx=e.clientX-d.x0, dy=e.clientY-d.y0;
    if(d.state==='maybe'){
      if(dx>10 && Math.abs(dx)>1.4*Math.abs(dy)){
        d.state='drag';
        try{ el.setPointerCapture(e.pointerId); }catch(_){}
        followEl.style.transition='none';
        const u=ue();
        if(u){ u.style.transition='none'; u.style.transform='translateX(-26%)'; u.style.opacity='.55'; }
      } else if(Math.abs(dy)>10 && Math.abs(dy)>=Math.abs(dx)){ d=null; }
      return;
    }
    const dd=Math.max(0,dx);
    followEl.style.transform='translateX('+dd+'px)';
    const u=ue();
    if(u){
      const w=followEl.offsetWidth||window.innerWidth;
      const p=Math.min(1, dd/Math.max(w,1));
      u.style.transform='translateX('+(-26*(1-p))+'%)';
      u.style.opacity=String(.55+.45*p);
    }
  });
  function fin(e){
    if(!d) return;
    const wasDrag=d.state==='drag';
    const dx=e.clientX-d.x0;
    d=null;
    if(!wasDrag) return;
    const u=ue();
    if(dx>80){
      followEl.style.transition='transform .19s cubic-bezier(.3,.9,.3,1)';
      followEl.style.transform='translateX(100%)';
      if(u){ u.style.transition='transform .19s ease, opacity .19s ease'; u.style.transform=''; u.style.opacity=''; }
      setTimeout(()=>{ followEl.style.transition=''; followEl.style.transform=''; if(u) u.style.transition=''; onBack(); }, 195);
    } else {
      followEl.style.transition='transform .2s cubic-bezier(.3,.9,.3,1)';
      followEl.style.transform='';
      if(u){ u.style.transition='transform .2s ease, opacity .2s ease'; u.style.transform='translateX(-26%)'; u.style.opacity='.55'; }
      setTimeout(()=>{
        if(u){ u.style.transform=''; u.style.opacity=''; u.style.transition=''; }
        followEl.style.transition='';
      }, 210);
    }
  }
  el.addEventListener('pointerup', fin);
  el.addEventListener('pointercancel', fin);
}

  });

    d.prev.style.transform='translateX('+(-26*(1-p))+'%)';
    d.prev.style.opacity=String(.55+.45*p);
  });
  function fin(e){
    if(!d) return;
    const wasDrag=d.state==='drag';
    const dx=e.clientX-d.x0;
    const cur=d.cur, prev=d.prev, idx=d.idx;
    d=null;
    if(!wasDrag) return;
    if(dx>80){

      cur.style.transform='';

        cur.classList.remove('swiping'); cur.style.transition='';
      }, 210);
    }
  }
  mainEl.addEventListener('pointerup', fin);
  mainEl.addEventListener('pointercancel', fin);

/* ================= Drive sync (中継 / Apps Script only) =================
   Since v1.11 the relay is the sole transport; the old GIS (Google
   login) route was removed. The relay, deployed under the user's own
   Google account, reads and writes movie.json on Drive (server-side
   name allowlist + shared secret), so sync needs no login at all and
   the connection can never lapse. URL + secret live only in this
   device's localStorage. In relay mode a file's "id" is its name. */
const DRIVE_FILE_NAME='movie.json';
let syncStatus='disconnected'; /* disconnected | syncing | synced | error */
let syncMsg='';
let lastSyncAt=0;
let syncTimer=null;
let syncRunning=false;

function setSyncStatus(st, msg){
  syncStatus=st; if(typeof msg==='string') syncMsg=msg;
  renderSyncStatus();
}
function renderSyncStatus(){
  let label, cls='';
  if(syncStatus==='synced') label='同期済み'+(lastSyncAt ? '（'+pad2(new Date(lastSyncAt).getHours())+':'+pad2(new Date(lastSyncAt).getMinutes())+'）' : '');
  else if(syncStatus==='syncing') label='同期中…';
  else if(syncStatus==='error'){ label='同期エラー'+(syncMsg ? '：'+syncMsg : ''); cls='err'; }
  else if(relayReady()) label='中継で接続済み（未同期）';
  else label='中継未設定（端末内に保存中）';
  const dot=$('syncdot');
  if(dot) dot.style.background = (relayReady() && syncStatus!=='error') ? 'var(--green)' : 'var(--red)';
  const msg=$('syncmsg');
  if(msg){
    let hint='';
    if(syncStatus==='syncing') hint='';
    else if(syncStatus==='error') hint=' ・ <span class="sbhint">タップで再試行</span>';
    else if(relayReady()) hint=' ・ <span class="sbhint">タップで再同期</span>';
    else hint=' ・ <span class="sbhint">タップで設定</span>';
    msg.innerHTML='<span class="'+cls+'">'+esc(label)+'</span>'+hint;
  }
  const st=$('syncstat'); if(st) st.innerHTML='<span class="'+cls+'">'+esc(label)+'</span>';
  const rv=$('syncrowval'); if(rv) rv.textContent=label;
}

function onSyncBarTap(){
  if(syncStatus==='syncing' || syncRunning) return;
  if(relayReady()){ syncNow('manual'); return; }
  /* not configured: take the user to the relay settings */
  showView('set');
}
function scheduleSync(){
  if(!relayReady()) return;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{ syncNow('auto'); }, 1500);
}
const LS_RELAY='movie.relay';
const RELAY_URL_DEFAULT='https://script.google.com/macros/s/AKfycbziV1Wpv7AWSUJJgaKyRzFeBR81Td4CjryGGuq4avt1xAo-e2mbeyS2vBpCuqx4_KI/exec';
function relayCfg(){ try{ const r=JSON.parse(storeGet(LS_RELAY)||'null'); return (r && r.secret) ? { url: r.url || RELAY_URL_DEFAULT, secret: r.secret } : null; }catch(e){ return null; } }
function relayReady(){ return !!relayCfg(); }
async function relayCall(op, name, content){
  const c=relayCfg(); if(!c) throw new Error('中継が未設定です');
  const res=await fetch(c.url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ secret:c.secret, op:op, name:name, content:content }) });
  if(!res.ok) throw new Error('中継 HTTP '+res.status);
  const j=JSON.parse(await res.text());
  if(!j || !j.ok) throw new Error('中継エラー：'+((j && j.error) || 'unknown'));
  return j;
}
function relaySaveAndTest(){
  const u=$('relay-url-in'), s=$('relay-secret-in'), st=$('relaystat');
  const url=(u ? u.value : '').trim() || RELAY_URL_DEFAULT, secret=(s ? s.value : '').trim();
  if(!secret){ if(st) st.textContent='シークレットを入力してください（URLは入力済みです）'; return; }
  storeSet(LS_RELAY, JSON.stringify({ url:url, secret:secret }));
  if(st) st.textContent='接続テスト中…';
  relayCall('ping').then(()=>{
    if(st) st.textContent='接続OK — 中継で同期します。';
    renderSyncStatus();
    syncNow('relay');
  }).catch(e=>{ if(st) st.textContent='接続に失敗しました：'+((e && e.message) || e); });
}
function relayClear(){
  storeDel(LS_RELAY);
  setSyncStatus('disconnected');
  refreshSettings();
}
async function findMovieFile(){
  const j=await relayCall('stat', DRIVE_FILE_NAME);
  return j.exists ? { id:DRIVE_FILE_NAME, name:DRIVE_FILE_NAME } : null;
}
async function downloadMovie(fileId){
  const j=await relayCall('get', DRIVE_FILE_NAME);
  return normalizeData(JSON.parse(j.content));
}
async function uploadMovieUpdate(fileId, data){
  await relayCall('put', DRIVE_FILE_NAME, JSON.stringify(data));
}
async function createMovie(data){
  await relayCall('put', DRIVE_FILE_NAME, JSON.stringify(data));
  return { id:DRIVE_FILE_NAME };
}
async function syncNow(reason){
  if(syncRunning) return;
  if(!relayReady()){ setSyncStatus('disconnected'); return; }
  syncRunning=true; setSyncStatus('syncing');
  try{
    const file=await findMovieFile();
    if(!file){
      await createMovie(DB); /* the app itself creates movie.json on first connect */
    } else {
      const remote=await downloadMovie(file.id);
      if(remote && remote.updatedAt>DB.updatedAt){
        DB=remote; saveLocal(); renderAll();
      } else if(DB.updatedAt>(remote?remote.updatedAt:0)){
        await uploadMovieUpdate(file.id, DB);
      }
    }
    lastSyncAt=Date.now();
    setSyncStatus('synced');
  }catch(e){
    setSyncStatus('error', (e && e.message) ? e.message : String(e));
  }finally{
    syncRunning=false;
  }
}

const APP_VERSION='2.3';
{ const vb=$('verBadge'); if(vb) vb.textContent='v'+APP_VERSION; }
function splashGo(){
  const sp=$('splash'); if(!sp || sp.dataset.went) return; sp.dataset.went='1';
  sp.classList.remove('wait'); sp.classList.add('hide');
  setTimeout(()=>{ try{ sp.remove(); }catch(e){} }, 520);
}
function checkForUpdate(){
  try{
    fetch(location.pathname+'?cv='+Date.now(), { cache:'no-store' })
      .then(r=>r.text())
      .then(t=>{
        const m=t.match(/name="app-version" content="([0-9.]+)"/);
        if(!m){ splashGo(); return; }
        const latest=m[1];
        if(latest===APP_VERSION){ splashGo(); return; }
        let tried=null;
        try{ tried=sessionStorage.getItem('movie.updateTried'); }catch(e){}
        if(tried===latest){ splashGo(); return; }
        try{ sessionStorage.setItem('movie.updateTried', latest); }catch(e){}
        location.replace(location.pathname+'?u='+Date.now());
      })
      .catch(()=>{ splashGo(); });
  }catch(e){ splashGo(); }
}
let hiddenAt=0;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ hiddenAt=Date.now(); return; }
  if(hiddenAt && Date.now()-hiddenAt>=60000) checkForUpdate();
});
/* iOS :active support */
document.addEventListener('touchstart', function(){}, { passive:true });

/* ================= init ================= */
(function init(){
  loadLocal();
  loadUI(); applyUI();
  const sp=$('splash');
  if(sp){
    sp.addEventListener('click', splashGo);
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) splashGo();
    setTimeout(splashGo, 1500);
    setTimeout(()=>{ try{ sp.remove(); }catch(e){} }, 2800);
  }
  renderAll();
  requestAnimationFrame(()=>{ pinNav(); moveInd(); });
  renderSyncStatus();
  renderSaveTime(); updateBell();
  if(relayReady()){
    /* a configured relay needs no login — sync on open. */
    setTimeout(()=>syncNow('startup'), 300);
  }
  checkForUpdate();
})();
</script>
</body>
</html>
